/* ===== кабінет: призначення завдань ===== */
const ASGD = {};
function adAssign(ab, p) {
  const a = p.asg, live = a && !a.fin;
  const dr = ASGD[p.id] = ASGD[p.id] || { ids: new Set(live ? a.ids : []), custom: live ? a.custom.map(c => Object.assign({}, c)) : [] };
  const status = a ? `<div class="card"><h3>${a.fin ? '✓ Попередній наказ виконано' : 'Поточний наказ'} · від ${fmtDate(a.d)}</h3><ul class="clist">${a.ids.filter(id => TASK[id]).map(id => { const t = TASK[id]; return `<li>${taskState(p, id) === 'done' ? '✅' : '⬜'} ${bookTag(t)}${SUBJ[t.s].short} · с. ${dp(t.p)}, № ${t.n} · ${esc(t.title)}</li>`; }).join('')}${a.custom.map((c, i) => `<li>${c.done ? (c.ok ? '✅' : '🟡') : '⬜'} ${esc(CSUBJ[c.s] || '')} · ${esc(c.x)}${c.done && !c.ok ? `<span class="sp"></span><button class="btn" data-cok="${i}">Підтвердити</button><button class="btn ghost" data-cback="${i}">Повернути</button>` : ''}</li>`).join('')}</ul><p class="note">${a.fin ? `Виконано ${fmtDate(a.fin)}. Новий наказ замінить цей.` : '🟡 – дитина позначила завдання виконаним. Підтвердіть, щоб нарахувати їй 15 кредитів, або поверніть на доопрацювання.'}</p></div>` : '';
  ab.innerHTML = `<div class="card"><h3>Наказ для ${esc(p.name)}</h3><p class="note">Позначте завдання, які задав учитель, і натисніть «Зберегти наказ». Після виходу з кабінету дитині будуть доступні лише вони; решта зошита, Тренувальна зала й Реванш відкриються, щойно наказ буде виконано. Сірим позначено вже виконані завдання.</p></div>${status}
  ${BOOKS.map(bk => `<h2 class="abook">${bk.t}${bk.id === BOOK_NEW ? ' · новий' : ''}</h2>` + bookSubj(bk.id).map(k => { const pages = [...new Set(BT(bk.id).filter(t => t.s === k).map(t => t.p))], n = BT(bk.id).filter(t => t.s === k && dr.ids.has(t.id)).length;
    const pageBlock = pg => `<div class="apage"><div class="aph"><b>Сторінка ${dp(pg)}</b><button type="button" class="opt sm" data-allpg="${pg}">Уся сторінка</button></div><div class="picks">${TASKS.filter(t => t.p === pg).map(t => { const dn = taskState(p, t.id) === 'done', on = dr.ids.has(t.id); return `<button type="button" class="pick ${on ? 'on' : ''}" data-pick="${t.id}" data-pg="${pg}" ${dn ? 'disabled' : ''}><i class="box">${on || dn ? '✓' : ''}</i><span><b>№ ${t.n}</b> ${esc(t.title)}</span>${dn ? '<small>виконано</small>' : ''}</button>`; }).join('')}</div></div>`;
    const body = k === 'eng' ? UNITS.map(u => { const up = pages.filter(pg => unitOfPage(dp(pg)) === u), un = TASKS.filter(t => t.unit === u.k && dr.ids.has(t.id)).length; return `<details class="aunit" ${un ? 'open' : ''}><summary>${esc(u.n)}</summary>${up.map(pageBlock).join('')}</details>`; }).join('') : pages.map(pageBlock).join('');
    return `<details class="card asub s-${k}" ${n ? 'open' : ''}><summary><b>${SUBJ[k].name}</b><span class="acount" data-acount="${bk.id}-${k}"></span></summary>${body}</details>`; }).join('')).join('')}
  <div class="card"><h3>Завдання не з цього зошита</h3><p class="note">Наприклад: «Підручник, с. 45, № 3». Дитина виконає його на папері й натисне «Готово», а ви підтвердите тут.</p><div class="row wrap"><select class="inp" id="cs"><option value="math">Математика</option><option value="ukr">Мова</option><option value="vs">Всесвіт</option><option value="eng">Англійська</option><option value="other">Інше</option></select><input class="inp" id="ct" placeholder="Підручник, с. 45, № 3" maxlength="120" autocomplete="off" style="flex:1 1 200px"><button type="button" class="btn" id="cadd">Додати</button></div><ul class="clist" id="clist"></ul></div>
  <div class="asgbar"><span id="acnt"></span><button type="button" class="btn ghost" id="aclr">Очистити</button><button type="button" class="btn" id="asave">Зберегти наказ</button></div>`;
  const upd = () => { const n = dr.ids.size + dr.custom.length; $('#acnt').textContent = n ? `Обрано: ${n}` : 'Нічого не обрано'; BOOKS.forEach(bk => bookSubj(bk.id).forEach(k => { const c = BT(bk.id).filter(t => t.s === k && dr.ids.has(t.id)).length, e = $(`[data-acount="${bk.id}-${k}"]`); if (e) e.textContent = c ? `обрано ${c}` : ''; })); };
  const setPick = (b, on) => { b.classList.toggle('on', on); $('.box', b).textContent = on ? '✓' : ''; };
  const drawC = () => { $('#clist').innerHTML = dr.custom.map((c, i) => `<li><b>${esc(CSUBJ[c.s] || '')}</b> ${esc(c.x)}<button type="button" class="x2" data-crm="${i}" aria-label="Прибрати">✕</button></li>`).join(''); $$('[data-crm]', ab).forEach(b => b.onclick = () => { dr.custom.splice(+b.dataset.crm, 1); drawC(); upd(); }); };
  $$('[data-pick]', ab).forEach(b => b.onclick = () => { const id = b.dataset.pick; dr.ids.has(id) ? dr.ids.delete(id) : dr.ids.add(id); setPick(b, dr.ids.has(id)); upd(); });
  $$('[data-allpg]', ab).forEach(b => b.onclick = () => { const bs = $$(`[data-pick][data-pg="${b.dataset.allpg}"]:not(:disabled)`, ab), all = bs.length && bs.every(x => dr.ids.has(x.dataset.pick)); bs.forEach(x => { all ? dr.ids.delete(x.dataset.pick) : dr.ids.add(x.dataset.pick); setPick(x, !all); }); upd(); });
  $('#cadd').onclick = () => { const x = $('#ct').value.trim(); if (!x) return $('#ct').focus(); dr.custom.push({ id: 'c' + Date.now().toString(36), s: $('#cs').value, x, done: 0, ok: 0 }); $('#ct').value = ''; drawC(); upd(); };
  $('#ct').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#cadd').click(); } };
  $('#aclr').onclick = () => { dr.ids.clear(); dr.custom.length = 0; $$('[data-pick]:not(:disabled)', ab).forEach(x => setPick(x, false)); drawC(); upd(); };
  $('#asave').onclick = () => {
    if (!dr.ids.size && !dr.custom.length) { if (p.asg && !p.asg.fin) { p.asg = null; save(p.id); toast('Наказ скасовано – зошит відкритий повністю.'); } else toast('Спершу позначте хоча б одне завдання.'); delete ASGD[p.id]; return adAssign(ab, p); }
    p.asg = { d: today(), ids: TASKS.filter(t => dr.ids.has(t.id)).map(t => t.id), custom: dr.custom.map(c => ({ id: c.id, s: c.s, x: c.x, done: c.done || 0, ok: c.ok || 0 })), fin: 0 };
    save(p.id); delete ASGD[p.id]; toast(`Наказ збережено: ${p.asg.ids.length + p.asg.custom.length} завд. Вийдіть з кабінету – дитина побачить його на головній.`); adAssign(ab, p); window.scrollTo(0, 0);
  };
  $$('[data-cok]', ab).forEach(b => b.onclick = () => { p.asg.custom[+b.dataset.cok].ok = 1; p.cr = (p.cr || 0) + 15; save(p.id); adAssign(ab, p); });
  $$('[data-cback]', ab).forEach(b => b.onclick = () => { const c = p.asg.custom[+b.dataset.cback]; c.done = 0; c.ok = 0; p.asg.fin = 0; save(p.id); delete ASGD[p.id]; adAssign(ab, p); });
  drawC(); upd();
}

/* ===== маршрутизація ===== */
const app = () => $('#app');
function go(h) { if (location.hash === '#' + h) route(); else location.hash = h; }
function route() {
  const h = (location.hash || '#home').slice(1); window.scrollTo(0, 0); CURTASK = null; if (typeof BLITZ_STOP === 'function') { BLITZ_STOP(); BLITZ_STOP = null; } if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (h === 'adult') return header(true), viewAdult();
  if (!CUR || !P() || h === 'who') return header(true), viewWho();
  header();
  if (lockedFor(h)) return viewLocked();
  if (h === 'books') return viewBooks();
  if (h === 'arsenal') return viewArsenal();
  if (h.startsWith('eu-')) return viewEU(h.slice(3));
  if (h.startsWith('t-') && TASK[h.slice(2)]) return viewTask(h.slice(2), false);
  if (h.startsWith('r-') && TASK[h.slice(2)]) return viewTask(h.slice(2), true);
  if (h.startsWith('s-') && SUBJ[h.slice(2)]) return viewSubject(h.slice(2));
  if (h === 'trainer') return viewTrainer();
  if (h === 'garden') return viewGarden();
  viewHome();
}
window.addEventListener('hashchange', route);
function header(bare) {
  const hd = $('#hd'), p = P();
  hd.innerHTML = `<a class="logo" href="#home"><span>Штаб героїв</span></a>
    ${!bare && p ? `<a class="me" href="#garden" title="Штаб"><span class="av">${avHTML(p.av, kitOf(p))}</span><span class="mi"><b>${esc(p.name)}</b><span class="xpbar"><i style="width:${p.xp % 150 / 1.5}%"></i></span><small>рівень ${levelOf(p.xp)} · ⬡ ${p.cr}</small></span></a>` : '<span></span>'}
    <nav>${!bare && p ? '<a class="ib" id="bbooks" href="#books">Зошити</a><button class="ib" id="bsearch">Пошук</button><button class="ib" id="bpanel">Стовпчик</button><a class="ib" href="#who">Учні</a>' : ''}<button class="ib" id="bview" title="Перемкнути вигляд: телефон / компʼютер">${document.body.classList.contains('mob') ? 'ПК' : 'Телефон'}</button><a class="ib" href="#adult" >Дорослим</a></nav>`;
  $('#bview').onclick = () => { setView(document.body.classList.contains('mob') ? 'desk' : 'mob'); header(bare); };
  const bn = $('#bn'); bn.hidden = !!bare || !p; if (!bn.hidden) { const h = location.hash || '#home'; bn.innerHTML = [['#home', '', 'Головна'], ['', '', 'Пошук'], ['', '', 'Стовпчик'], ['#trainer', '', 'Зала'], ['#garden', '', 'Штаб']].map(([u, i, n]) => u ? `<a href="${u}" class="${h === u ? 'on' : ''}"><i>${i}</i>${n}</a>` : `<button data-b="${n}"><i>${i}</i>${n}</button>`).join(''); $('[data-b="Пошук"]', bn).onclick = openSearch; $('[data-b="Стовпчик"]', bn).onclick = () => openPanel(); }
  if ($('#bsearch')) $('#bsearch').onclick = openSearch; if ($('#bpanel')) $('#bpanel').onclick = () => openPanel();
  setCloud(cloudState);
}

    <form class="card newp" id="newp"><h3>Новий учень</h3><label class="fld"><span>Ім’я</span><input class="inp" id="nname" maxlength="20" autocomplete="off" style="width:12em"></label><div class="avs"></div><button class="btn">Створити профіль</button></form>`;
  DB.order.forEach(id => { const p = DB.profiles[id]; if (!p) return; const b = el(`<button class="pcard"><span class="av big">${avHTML(p.av, kitOf(p))}</span><b>${esc(p.name)}</b><small>рівень ${levelOf(p.xp)} · ${summary(p).done} завдань</small></button>`); b.onclick = () => { CUR = id; saveLocal(); go('books'); }; $('.who').append(b); });
  let av = AVATARS[0]; AVATARS.slice(0, 4).forEach((a, i) => { const b = el(`<button type="button" class="avb ${i ? '' : 'on'}">${avHTML(a)}<small>${avName(a)}</small></button>`); b.onclick = () => { av = a; $$('.avb').forEach(x => x.classList.toggle('on', x === b)); }; $('.avs').append(b); });

/* ===== вибір зошита ===== */
function bookProg(p, b) { const ts = BT(b); return [ts.filter(t => taskState(p, t.id) === 'done').length, ts.length]; }
function viewBooks() {
  const p = P(), m = activeMission(p);
  app().innerHTML = `<div class="hero"><h1>${esc(p.name)}, обери зошит</h1><p>Щотижня – новий зошит. Попередні залишаються тут: їх можна доробити або повторити.</p></div>${orderCard(p)}
  <div class="books">${BOOKS.map(b => { const [a, n] = bookProg(p, b.id), cur = CURB() === b.id, mc = m ? m.ids.filter(id => TASK[id] && TASK[id].book === b.id && taskState(p, id) !== 'done').length : 0;
    return `<button type="button" class="card bookc ${b.kind} ${cur ? 'cur' : ''}" data-book="${b.id}"><span class="bkn">${b.kind === 'eng' ? 'EN' : b.n}</span><span class="bkt"><b>${b.t}${b.id === BOOK_NEW ? ' <i class="new">новий</i>' : ''}</b><small>${esc(b.sub)}</small><span class="bar"><i style="width:${n ? a / n * 100 : 0}%"></i></span><small>${a} з ${n} завдань${mc ? ` · у наказі: ${mc}` : ''}${cur ? ' · ти тут' : ''}</small></span></button>`; }).join('')}</div>`;
  $$('[data-book]').forEach(x => x.onclick = () => { p.book = x.dataset.book; save(CUR); go(p.book === 'eng' ? 's-eng' : 'home'); });

/* ===== головна ===== */
const nextTask = (p, from) => { const m = activeMission(p), pool = m ? TASKS.filter(t => m.ids.includes(t.id)) : BT(), i = from ? pool.findIndex(t => t.id === from) : -1; return pool.slice(i + 1).concat(pool.slice(0, i + 1)).find(t => taskState(p, t.id) !== 'done'); };
function subjProg(p, s, b) { const ts = (b === '*' ? TASKS : BT(b)).filter(t => t.s === s); return [ts.filter(t => taskState(p, t.id) === 'done').length, ts.length]; }
function viewHome() {
  const p = P(), s = summary(p), m = activeMission(p), cont = (!m && p.last && taskState(p, p.last) !== 'done' && TASK[p.last]) || nextTask(p), rev = reviewList(p), st = streak(p);

  <div class="card"><h3>Успішність за предметами</h3>${Object.keys(SUBJ).map(k => { const [a, b] = subjProg(p, k, '*'), x = ts.filter(q => q.s === k), n = x.reduce((u, q) => u + q.n, 0), f = x.reduce((u, q) => u + q.first, 0); return `<div class="srow s-${k}"><b>${SUBJ[k].name}</b><span class="bar"><i style="width:${a / b * 100}%"></i></span><span>${a} з ${b} завдань · з першої спроби ${n ? Math.round(f / n * 100) : 0}% (${f} з ${n} відповідей)</span></div>`; }).join('')}</div>
  <div class="two"><div class="card"><h3>✅ Засвоєно добре</h3>${strong.length ? '<ul>' + strong.map(x => `<li>${SUBJ[x.s].short}: <b>${x.topic}</b> – ${x.first} з ${x.n} з першої спроби</li>`).join('') + '</ul>' : '<p class="note">Поки що замало даних (потрібно щонайменше 3 відповіді в темі).</p>'}</div>
  <div class="card"><h3>⚠ Потребує уваги</h3>${weak.length ? '<ul>' + weak.map(x => `<li>${SUBJ[x.s].short}: <b>${x.topic}</b> – лише ${x.first} з ${x.n} з першої спроби, у середньому ${(x.att / x.n).toFixed(1)} спроби на відповідь</li>`).join('') + '</ul>' : '<p class="note">Тем із часткою правильних з першої спроби нижче 60% немає.</p>'}</div></div>
  <div class="card"><h3>Динаміка за 14 днів</h3><p class="note"><span class="lg bc"></span> правильні перевірки <span class="lg bw"></span> неправильні спроби</p>${chart}</div>
  <div class="card"><h3>Як читати ці дані</h3><p class="note">«З першої спроби» показує реальне розуміння: відповідь без підказок і перебору. Завдання, виконане після кількох спроб, зараховується, але потрапляє в «Повторення». Творчі й усні завдання програма не оцінює – їх варто переглянути на вкладці «Відповіді дитини».</p></div>`;
}
function adPages(ab, p) {
  ab.innerHTML = `<div class="card"><p class="note">Колір: зелений – виконано без помилок, жовтий – виконано з помилками (✗ – неправильні спроби), синій – розпочато; 🗣 – скільки разів дитина відкривала пояснення чи приклад, 📄 – досьє. Натисніть, щоб відкрити завдання (воно відкриється в профілі вибраного учня).</p>${BOOKS.map(bk => `<h3 class="abook">${bk.t}</h3>` + [...new Set(BT(bk.id).map(t => t.p))].map(pg => { const ts = TASKS.filter(t => t.p === pg); return `<div class="pgrow"><b>${pg > 1000 && pg < 2000 ? 'англ. ' : ''}с. ${dp(pg)}</b><div class="tl">${ts.map(t => { const s = p.tasks[t.id], st = taskState(p, t.id); return `<a class="tchip ${st} ${s && s.done && s.wrong ? 'warn' : ''}" href="#t-${t.id}" data-open="${t.id}"><em>№ ${t.n}</em>${esc(t.title)}${s && s.wrong ? ` · ✗${s.wrong}` : ''}${s && s.solid ? ' · 🔁✓' : ''}${s && s.help ? ' · 🗣' + s.help : ''}${s && s.dos ? ' · 📄' + s.dos : ''}</a>`; }).join('')}</div></div>`; }).join('')).join('')}</div>`;
  $$('[data-open]', ab).forEach(a => a.onclick = () => { CUR = adultPid; saveLocal(); });
}
function adOpen(ab, p) {
  const items = []; TASKS.forEach(t => { const s = p.tasks[t.id]; if (!s) return; t.parts.forEach((pt, i) => { if (pt.t === 'open' && s.parts[i] && s.parts[i].ok) items.push({ t, pt, i, ps: s.parts[i] }); }); });
  ab.innerHTML = items.length ? items.sort((a, b) => (a.ps.status === 'new' ? 0 : 1) - (b.ps.status === 'new' ? 0 : 1)).map((x, k) => `<div class="card oa"><small>${SUBJ[x.t.s].name} · ${label(x.t)} · ${esc(x.t.title)}</small><p class="oq">${x.pt.q}</p><blockquote>${esc(x.ps.val)}</blockquote><div class="row wrap"><span class="pill">${x.ps.status === 'ok' ? '✅ зараховано' : x.ps.status === 'back' ? '↩ повернено на доопрацювання' : '🆕 не переглянуто'}</span><button class="btn" data-ok="${k}">Зарахувати</button><input class="inp" placeholder="Коментар для дитини" data-cm="${k}" style="width:14em" value="${esc(x.ps.comment || '')}"><button class="btn ghost" data-back="${k}">Повернути на доопрацювання</button></div></div>`).join('') : '<div class="card">Дитина ще не зберегла жодної письмової відповіді.</div>';
  $$('[data-ok]', ab).forEach(b => b.onclick = () => { items[b.dataset.ok].ps.status = 'ok'; save(adultPid); adOpen(ab, p); });
  $$('[data-back]', ab).forEach(b => b.onclick = () => { const x = items[b.dataset.back]; x.ps.status = 'back'; x.ps.comment = $(`[data-cm="${b.dataset.back}"]`, ab).value.trim().slice(0, 200); save(adultPid); adOpen(ab, p); });
}
function adKey(ab) {
  ab.innerHTML = `<div class="card"><input class="inp wide" id="kq" placeholder="Пошук: номер, «21 5» або слово" autocomplete="off"><p class="note">Усього в каталозі ${TASKS.length} вправ: зошит (с. 6–35) і Student’s Book з англійської (с. 4–105) (${TASKS.reduce((a, t) => a + t.parts.length, 0)} інтерактивних частин). Сторінки 10 немає. Друкованого ключа зошит не містить: відповіді сформовано під час підготовки платформи; позначка ⚠ показує місця, які варто звірити з учителем.</p></div><div id="kl"></div>`;
  const run = () => { const q = $('#kq').value, r = q.trim() ? findTasks(q) : TASKS; $('#kl').innerHTML = r.map(t => `<details class="card key s-${t.s}"><summary><b>${label(t)}</b> · ${SUBJ[t.s].short} · ${esc(t.title)} ${t.verify ? '⚠' : ''}${t.audit ? ' · селфі-аудит' : ''}</summary><p class="ttext">${t.text}</p>${t.verify ? `<p class="warnbox">⚠ ${esc(t.verify)}</p>` : ''}<ol>${t.parts.map(pt => `<li>${pt.bonus ? '<span class="tag">бонус</span> ' : ''}${pt.q}<br><span class="ans">Ключ: ${esc(keyOf(pt))}</span></li>`).join('')}</ol><a class="btn ghost" href="#t-${t.id}">Відкрити вправу</a></details>`).join('') || '<div class="card">Нічого не знайдено.</div>'; };
  $('#kq').oninput = run; run();
}
function adClass(ab) {
  ab.innerHTML = `<div class="card"><div class="tw"><table class="tbl"><tr><th>Учень</th><th>Виконано</th><th>Мова</th><th>Математика</th><th>Всесвіт</th><th>Англ.</th><th>З першої спроби</th><th>Повторення</th><th>Остання активність</th></tr>${DB.order.map(id => { const p = DB.profiles[id], s = summary(p), pt = partTotals(p), ld = Object.keys(p.days).sort().pop() || '–'; return `<tr><td><span class="av">${avHTML(p.av, kitOf(p))}</span> ${esc(p.name)}</td><td>${s.done}/${TASKS.length}</td>${Object.keys(SUBJ).map(k => `<td>${subjProg(p, k, '*').join('/')}</td>`).join('')}<td>${pt.n ? Math.round(pt.first / pt.n * 100) : 0}%</td><td>${reviewList(p).length}</td><td>${ld}</td></tr>`; }).join('')}</table></div><p class="note">Щоб вести клас на одному пристрої, створіть профіль для кожного учня. Для перенесення результатів між пристроями скористайтеся експортом на вкладці «Налаштування й дані».</p></div>`;
}
function adData(ab, p) {
  ab.innerHTML = `<div class="card"><h3>Рівень підтримки для ${esc(p.name)}</h3><div class="row wrap"><button class="opt ${p.support === 1 ? 'on' : ''}" data-sup="1">Підказка після першої помилки</button><button class="opt ${p.support === 2 ? 'on' : ''}" data-sup="2">Після другої помилки</button><button class="opt ${p.support === 9 ? 'on' : ''}" data-sup="9">Лише на прохання дитини</button></div><p class="note">Правильну відповідь програма дитині не показує за жодного рівня.</p></div>
  <div class="card"><h3>Перенесення даних</h3><p class="note">Стан: ${cloudState === 'ok' ? 'прогрес зберігається в хмарі цієї сторінки й доступний з інших пристроїв під тим самим обліковим записом.' : 'прогрес зберігається лише в цьому браузері. Зробіть копію, щоб не втратити його.'}</p><textarea class="inp area" id="exp" rows="4" readonly></textarea><div class="row wrap"><button class="btn" id="bexp">Показати й скопіювати копію профілю</button></div><textarea class="inp area" id="imp" rows="3" placeholder="Вставте сюди скопійований текст профілю"></textarea><div class="row wrap"><button class="btn ghost" id="bimp">Імпортувати профіль</button></div><div class="fb" id="dfb" hidden></div></div>
  <div class="card"><h3>Змінити PIN-код</h3><div class="row wrap"><input class="inp" id="pold" type="password" inputmode="numeric" maxlength="8" placeholder="старий PIN" autocomplete="off" style="width:9em"><input class="inp" id="pnew" type="password" inputmode="numeric" maxlength="8" placeholder="новий PIN" autocomplete="off" style="width:9em"><button class="btn" id="bpin">Змінити PIN</button></div><div class="fb" id="pfb" hidden></div><p class="note">4–8 цифр. Змініть PIN, якщо дитина його дізналася.</p></div>
  <div class="card"><h3>Небезпечні дії</h3><div class="row wrap"><button class="btn ghost" data-danger="reset">Скинути прогрес учня</button><button class="btn ghost" data-danger="del">Видалити профіль</button><button class="btn ghost" data-danger="pin">Скинути PIN-код</button></div></div>`;
  const fb = (c, t) => { const f = $('#dfb'); f.hidden = false; f.className = 'fb ' + c; f.textContent = t; };
  $('#bpin').onclick = () => { const o = $('#pold').value.trim(), n = $('#pnew').value.trim(), f = $('#pfb'), say = (c, t) => { f.hidden = false; f.className = 'fb ' + c; f.textContent = t; }; if (pinHash(o) !== DB.pin) return say('bad', 'Старий PIN неправильний.'); if (!/^\d{4,8}$/.test(n)) return say('bad', 'Новий PIN має складатися з 4–8 цифр.'); if (n === o) return say('bad', 'Новий PIN збігається зі старим.'); DB.pin = pinHash(n); save(); $('#pold').value = $('#pnew').value = ''; say('good', 'PIN змінено.'); };
  $$('[data-sup]', ab).forEach(b => b.onclick = () => { p.support = +b.dataset.sup; save(adultPid); adData(ab, p); });
  $('#bexp').onclick = async () => { $('#exp').value = JSON.stringify(p); try { await navigator.clipboard.writeText($('#exp').value); fb('good', 'Скопійовано в буфер обміну.'); } catch (e) { $('#exp').select(); fb('tip', 'Виділіть текст у полі та скопіюйте його вручну.'); } };
  $('#bimp').onclick = () => { try { const o = JSON.parse($('#imp').value); if (!o.id || !o.tasks || !o.name) throw 0; o.rev = Date.now(); delete DB.deleted[o.id]; DB.profiles[o.id] = o; if (!DB.order.includes(o.id)) DB.order.push(o.id); save(o.id); save(); adultPid = o.id; fb('good', `Профіль «${o.name}» імпортовано.`); } catch (e) { fb('bad', 'Не вдалося прочитати текст. Вставте копію профілю повністю.'); } };
  $$('[data-danger]', ab).forEach(b => b.onclick = () => {
    if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Натисніть ще раз для підтвердження'; b.classList.add('arm'); return; }
    const k = b.dataset.danger;
    if (k === 'reset') { Object.assign(p, { xp: 0, tasks: {}, days: {}, badges: {}, claimed: {}, gen: {}, last: null, stat: { persist: 0, hard: 0, panel: 0, solid: 0, streak1: 0 } }); save(adultPid); }
    if (k === 'del') { delete DB.profiles[adultPid]; DB.deleted[adultPid] = Date.now(); DB.order = DB.order.filter(x => x !== adultPid); dirty.add('p:' + adultPid); if (CUR === adultPid) CUR = null; adultPid = null; save(); }
    if (k === 'pin') { DB.pin = null; save(); adultOpen = false; }
    viewAdult();
  });
}

/* ===== вигляд: телефон / компʼютер ===== */
function applyView() { let m = 'auto'; try { m = localStorage.getItem(LS + ':view') || 'auto'; } catch (e) { } document.body.classList.toggle('mob', m === 'mob' || (m === 'auto' && window.matchMedia('(max-width:700px)').matches)); }
function setView(m) { try { localStorage.setItem(LS + ':view', m); } catch (e) { } applyView(); }
window.addEventListener('resize', () => { const was = document.body.classList.contains('mob'); applyView(); if (was !== document.body.classList.contains('mob')) header(!CUR || location.hash === '#adult'); });

/* ===== старт ===== */
document.addEventListener('DOMContentLoaded', () => { applyView(); route(); initCloud(); });

</script>
</body>
</html>
