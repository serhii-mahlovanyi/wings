<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111417">
<title>Штаб героїв</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>:root{
  /* Світ: світла лука з метеликами; кожен предмет має колір свого розділу в зошиті. Одна тема за задумом. */
  --bg:#f2f6ff; --card:#ffffff; --ink:#1c2340; --mute:#5d668a; --line:#dbe2f5;
  --ukr:#e23e68; --math:#2a66d9; --vs:#17966a; --sun:#ffbf3c; --good:#17966a; --bad:#d8433b;
  --acc:var(--math);
  --display:'Unbounded','Trebuchet MS',sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(1200px 500px at 80% -10%,#ffe9f0 0,transparent 60%) no-repeat;color:var(--ink);font:17px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(22px,4.5vw,32px)} h2{font-size:18px;margin:28px 0 12px} h3{font-size:15px;margin-bottom:10px}
a{color:inherit} button{font:inherit;color:inherit;cursor:pointer} img{max-width:100%}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.s-ukr{--acc:var(--ukr)} .s-math{--acc:var(--math)} .s-vs{--acc:var(--vs)}
#hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:700;text-decoration:none;font-size:15px;white-space:nowrap}
.me{display:flex;gap:8px;align-items:center;text-decoration:none;min-width:0}
.av{font-size:26px;line-height:1}.av.big{font-size:48px}
.mi{display:grid;font-size:13px;line-height:1.2;min-width:90px}.mi small{color:var(--mute)}
.xpbar,.bar{display:block;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.xpbar i,.bar i{display:block;height:100%;background:var(--acc);border-radius:8px}.xpbar i{background:var(--sun)}
nav{display:flex;gap:4px}.ib{border:0;background:none;font-size:20px;padding:6px 8px;border-radius:10px;text-decoration:none}.ib:hover{background:var(--bg)}
main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
.hero{padding:14px 0 6px}.hero p{color:var(--mute);margin:6px 0 0;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:block;text-decoration:none}
.cont{display:grid;gap:4px;border-left:8px solid var(--acc);position:relative;margin-top:12px}.cont small,.cont span{color:var(--mute)}.cont b{font-family:var(--display);font-size:18px}.cont .btn{justify-self:start;margin-top:8px;font-style:normal}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.sub{display:grid;gap:6px;text-align:left;border-top:6px solid var(--acc)}.sub small{color:var(--mute)}.sico{font-size:30px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;padding:10px 16px;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}.btn.big{font-size:18px;padding:12px 22px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}.btn.arm{border-color:var(--bad);color:var(--bad)}.btn:disabled{opacity:.5}
.back{display:inline-block;border:0;background:none;color:var(--mute);text-decoration:none;font-weight:700;padding:4px 0}
.chip{display:block;width:max-content;margin:0 auto 20px;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--mute)}.chip.ok{color:var(--good)}.chip.err{color:var(--bad)}
.missions{display:grid;gap:12px}.mis{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.mis small{color:var(--mute);display:block}.mis em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}.mis.ok b{color:var(--good)}
.who{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}.pcard{display:grid;justify-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 20px;min-width:140px}.pcard small{color:var(--mute)}
.newp{display:grid;gap:12px;max-width:420px}.avs,.row{display:flex;gap:8px;align-items:center}.row.wrap,.avs{flex-wrap:wrap}
.avb{font-size:28px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px}.avb.on{border-color:var(--sun);background:#fff7e0}.avb:disabled{opacity:.45}
.pg{margin-top:12px;border-left:8px solid var(--acc)}.pgh{display:flex;justify-content:space-between;margin-bottom:10px}.pgh span{color:var(--mute)}
.tl{display:flex;flex-wrap:wrap;gap:8px}.tl.col{flex-direction:column;margin-top:12px}
.tchip{display:inline-flex;gap:8px;align-items:baseline;border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-decoration:none;font-size:15px;background:#fff}
.tchip em{font-style:normal;font-weight:800;color:var(--acc);white-space:nowrap}.tchip.done{background:#e6f6ee;border-color:#a9dcc4}.tchip.part{background:#e8f0ff;border-color:#b3c8f5}.tchip.warn{background:#fff4d6;border-color:#f2cf73}
.miss{margin-top:12px;color:var(--mute);border-style:dashed}
.task .th{display:grid;gap:8px}.tmeta,.tbtns{display:flex;flex-wrap:wrap;gap:6px}
.pill,.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:20px;padding:2px 10px;background:color-mix(in srgb,var(--acc) 14%,#fff);color:var(--acc)}
.tag{background:#fff3cf;color:#8a5a00}.tag.aud{background:#e9e4ff;color:#4b3aa8}.pill.rv{background:#fff3cf;color:#8a5a00}
.ttext{margin:0;max-width:68ch}.ttext b{color:var(--acc)}
.cropbox{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px}.cropbox summary{font-weight:800;color:var(--mute);cursor:pointer;font-size:14px}
.crop{position:relative;overflow:hidden;width:100%;border-radius:10px;margin-top:8px;max-height:none}.crop img{position:absolute;max-width:none;height:auto}.crop.full img{position:static;width:100%;max-width:100%}
.parts{display:grid;gap:14px}
.part{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}.part.done{border-color:#a9dcc4;background:#f4fbf7}.part.bonus{border-style:dashed}
.ph{display:flex;gap:10px;align-items:flex-start}.pn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800}.part.done .pn{background:var(--good)}.pq{font-weight:700}
.pact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);max-width:100%}.inp.wide,.inp.area{width:100%}.inp.bad,.cw input.bad,.colg input.bad{border-color:var(--bad);background:#ffecea}.inp.good,.colg input.good{border-color:var(--good);background:#e6f6ee}
.fields{display:grid;gap:8px}.fields.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.fld{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.fld span{flex:1 1 140px}
.opts{display:grid;gap:8px}.opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:600}.opt.sm{padding:5px 10px;font-size:14px}
.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,#fff)}.opt.bad{border-color:var(--bad);background:#ffecea}.opt.ok{border-color:var(--good);background:#e6f6ee}.opt:disabled{opacity:.75;cursor:default}
.multi .opt.on::before{content:'✓ '}
.mhint,.note{font-size:13.5px;color:var(--mute);margin:4px 0}
.match .ml{display:grid;gap:8px}.mrow{display:grid;gap:2px;text-align:left;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;background:#fff}.mrow span{color:var(--mute)}.mrow.set{border-style:solid}.mrow.set span{color:var(--ink)}.mrow.act{border-color:var(--sun);background:#fffaea}
.mr,.pool{display:grid;gap:8px}
.seq{margin:0;padding-left:26px;display:grid;gap:6px;min-height:20px}.seq .opt{width:100%}
.crow{display:grid;gap:6px;padding:8px;border-radius:12px;border:2px solid transparent}.crow+.crow{border-top-color:var(--line);border-radius:0}.crow.bad{border-color:var(--bad);border-radius:12px;background:#fff6f5}.cbtns{display:flex;flex-wrap:wrap;gap:6px}
.gaps{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:19px}.gap{white-space:nowrap}.inp.g{padding:3px 4px;text-align:center;margin:0 1px}
.cwwrap{display:grid;gap:12px}.cw{display:grid;gap:2px;max-width:480px}.cw i{aspect-ratio:1}.cc{position:relative;aspect-ratio:1}.cc input{width:100%;height:100%;border:2px solid #9cc4f0;border-radius:4px;text-align:center;font:800 clamp(13px,3.6vw,18px) var(--body);padding:0;text-transform:uppercase;background:#fff;color:var(--ink)}.cc sup{position:absolute;left:2px;top:-1px;font-size:9px;font-weight:800;color:var(--acc)}
.clues{margin:0;padding-left:22px;display:grid;gap:4px;font-size:15px}.clues em{color:var(--mute);font-size:13px}
.scaf{display:grid;gap:8px;background:#fffaea;border-radius:12px;padding:10px}.scaf p{margin:0;font-size:14px}
.fb{border-radius:12px;padding:10px 12px;font-size:15.5px}.fb.good{background:#e6f6ee;color:#0d5c40}.fb.bad{background:#fff1ef;color:#7c2a25}.fb.tip{background:#fffaea;color:#6b4a00}.hint{margin-top:6px}.again{margin-top:4px;font-weight:800}
.membox .memt{font-weight:800;color:var(--acc)}
.drawtools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.drawarea{position:relative;border:2px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;background:#fff}.drawarea .crop{margin:0;border-radius:0;position:absolute;inset:0;height:100%}.drawarea canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.gridbg{background-image:linear-gradient(#bfe0fb 1px,transparent 1px),linear-gradient(90deg,#bfe0fb 1px,transparent 1px);background-size:6.25% 9.09%}
.tnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--good)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,26,60,.45);display:grid;place-items:center;padding:12px;overflow:auto}
.sheet{background:#fff;border-radius:20px;padding:20px;width:min(560px,100%);position:relative;max-height:94vh;overflow:auto}.sheet.wide{width:min(820px,100%)}
.x{position:absolute;right:10px;top:10px;border:0;background:var(--bg);border-radius:50%;width:34px;height:34px}
.cele{text-align:center;display:grid;gap:10px;justify-items:center}.fly{font-size:40px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.pagewrap{overflow:auto;max-height:78vh}.pagewrap img{width:100%;min-width:560px}
#toasts{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;display:grid;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;text-align:center;font-weight:700;font-size:15px;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.garden{position:relative;height:260px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}.bf{position:absolute;font-size:30px;animation:bob 3s ease-in-out infinite}.gme{position:absolute;left:46%;bottom:10px;font-size:46px}.gempty{position:absolute;inset:auto 16px 70px;text-align:center;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.badge{display:grid;gap:2px;justify-items:center;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;opacity:.45;filter:grayscale(1)}.badge.on{opacity:1;filter:none;border-color:var(--sun)}.badge span{font-size:30px}.badge small{color:var(--mute);font-size:12.5px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid}.tile b{font:700 22px var(--display);font-variant-numeric:tabular-nums}.tile span{font-size:13px;color:var(--mute)}
#ab .card{margin-bottom:12px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.two ul,.key ol{margin:0;padding-left:20px}
.srow{display:grid;gap:4px;margin-bottom:10px}.srow span:last-child{font-size:13.5px;color:var(--mute)}
.chart{width:100%;height:auto}.chart .gr{stroke:var(--line)}.chart .ax{font:10px var(--body);fill:var(--mute)}.chart .ax.b{fill:var(--ink);font-weight:800}.bc{fill:var(--good);background:var(--good)}.bw{fill:#f0a59f;background:#f0a59f}.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:8px}
.pgrow{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.oa blockquote{margin:8px 0;padding:10px 12px;background:var(--bg);border-radius:12px;white-space:pre-wrap}.oq{margin:4px 0;font-weight:700}
.key summary{cursor:pointer}.key li{margin:6px 0}.ans{color:var(--good);font-weight:700}.warnbox{background:#fff4d6;border-radius:10px;padding:8px 10px;font-size:14px}
.tw{overflow-x:auto}.tbl{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.gate{max-width:420px;display:grid;gap:10px;margin-top:12px}
.colg{border-collapse:collapse;margin:12px 0;background-image:linear-gradient(#cfe6fb 1px,transparent 1px),linear-gradient(90deg,#cfe6fb 1px,transparent 1px);background-size:38px 38px}
.colg td{width:38px;height:38px;text-align:center;font:700 22px var(--body);padding:0;font-variant-numeric:tabular-nums}.colg input{width:34px;height:34px;border:2px solid #9cc4f0;border-radius:6px;text-align:center;font:700 20px var(--body);padding:0;background:#fff;color:var(--ink)}
.colg .carry td{height:26px}.colg .carry input{height:22px;width:26px;font-size:12px;border-style:dashed;color:var(--mute)}.colg .line td{height:3px;background:var(--ink)}
.steps{padding-left:22px;display:grid;gap:6px;font-size:15px}.divl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0}.divl .big{font:700 22px var(--body)}
.freeg{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));max-width:560px;margin:8px 0;border-left:1px solid #9cc4f0;border-top:1px solid #9cc4f0}.freeg input{aspect-ratio:1;width:100%;border:0;border-right:1px solid #9cc4f0;border-bottom:1px solid #9cc4f0;text-align:center;font:700 clamp(13px,3.4vw,19px) var(--body);padding:0;border-radius:0;background:#fff;color:var(--ink)}
.roz{border-collapse:collapse;margin:12px 0;width:100%;max-width:560px}.roz th,.roz td{border:1px solid var(--line);text-align:center;padding:4px}.roz .sm{font-size:11px;color:var(--mute)}.roz .dg{font:700 22px var(--body)}.c1{color:#7a3fa0}.c2{color:var(--vs)}.c3{color:var(--bad)}
@media (max-width:520px){.logo span{display:none}body{font-size:16px}.pgrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.helpbox{background:#fffaea;border:2px solid var(--sun);border-radius:14px;padding:10px 14px}.helpbox p{margin:6px 0 0;max-width:68ch}
.padb{border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 7px;font-size:16px}
.fld.pre{justify-content:flex-start}.fld.pre .inp{flex:1 1 220px}
.sol{display:grid;gap:8px}.solrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border-radius:12px;border:2px solid transparent}.solrow.bad{border-color:var(--bad);background:#fff6f5}.solrow .se{width:11em}.solrow .sr{width:6.5em}.solrow .sk{flex:1 1 200px;min-width:0}
.padwrap{overflow-x:auto;margin:12px 0}.pgrid{display:grid;width:max-content;background-image:linear-gradient(#cfe6fb 1px,transparent 1px),linear-gradient(90deg,#cfe6fb 1px,transparent 1px);background-size:36px 36px;border-right:1px solid #cfe6fb;border-bottom:1px solid #cfe6fb}
.pc{width:36px;height:36px;display:grid;place-items:center;font:700 22px var(--body);font-variant-numeric:tabular-nums;color:var(--ink)}.pc.in{color:#2a3fb5}.pc.dn{color:#2a3fb5}.pc.mk{font-size:12px;color:var(--bad);align-items:end;padding-bottom:1px}.pc.ul{border-bottom:3px solid var(--ink)}.pc.br{border-right:3px solid var(--ink)}.pc.act{background:#ffe89a;outline:2px solid var(--sun);outline-offset:-2px}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:360px;margin-top:10px}.key{border:2px solid var(--line);background:#fff;border-radius:12px;font:800 20px var(--body);padding:8px 0}.key:active{background:var(--bg)}
.parts{grid-template-columns:minmax(0,1fr)}.part{min-width:0}.part>*{min-width:0}.solrow .sk{width:100%;max-width:100%}.fields .fld{min-width:0}

.book{margin:14px 0;background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--mute)}.book b{color:var(--ink)}.book.need{border-color:var(--sun);background:#fffaea;color:#6b4a00}
.zig pre{font:700 18px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;margin:6px 0}.zig p{margin:4px 0;font-size:14px;color:var(--mute)}
.ciph td,.ciph th{text-align:center;font-weight:700}.memlist{font-weight:700;font-size:18px;padding-left:24px}
#cloud{display:none}
#bn{display:none}
body.mob{font-size:17px}
body.mob #bn:not([hidden]){display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#bn a,#bn button{display:grid;justify-items:center;gap:0;border:0;background:none;text-decoration:none;font-size:11.5px;font-weight:800;color:var(--mute);padding:4px 0;border-radius:12px}#bn i{font-style:normal;font-size:22px;line-height:1.1}#bn .on{color:var(--math);background:var(--bg)}
body.mob main{padding:10px 12px 96px}body.mob #hd{padding:6px 10px;gap:6px}body.mob #bsearch,body.mob #bpanel,body.mob .logo span{display:none}
body.mob .btn{min-height:48px;padding:12px 18px}body.mob .opt{padding:12px 14px;min-height:46px}body.mob .opt.sm{padding:9px 12px;min-height:40px}
body.mob .inp{font-size:17px;padding:10px}body.mob .part{padding:12px;border-radius:16px}body.mob .pact .btn:first-child{flex:1 1 100%;justify-content:center}
body.mob .subs{grid-template-columns:1fr 1fr}body.mob .tchip{width:100%}body.mob .fld{flex-direction:column;align-items:stretch}body.mob .fld span{flex:none}body.mob .fld .inp{width:100%!important}body.mob .fields.grid{grid-template-columns:1fr 1fr}
body.mob .fld:has(.padb){display:grid;grid-template-columns:1fr auto}body.mob .fld:has(.padb) span{grid-column:1/-1}
body.mob .solrow .se{flex:1 1 9em;width:auto}body.mob .keypad{grid-template-columns:repeat(4,1fr);max-width:none}body.mob .key{padding:12px 0;font-size:22px}
body.mob .sheet{padding:16px 12px;border-radius:18px}body.mob .modal{padding:6px;place-items:end center}body.mob .tnav .btn{min-height:42px;padding:8px 12px}
body.mob .tbtns .btn{min-height:40px;padding:8px 12px;font-size:15px}
body.mob .gaps{font-size:20px;gap:12px 16px}body.mob .inp.g{width:2.2em!important}

/* ---- яскравіший вигляд, герої, анімації ---- */

function expandCheck(target) {
  return v => {
    const parts = String(v).replace(/\s/g, '').split('+').filter(Boolean).map(Number);

    return true;
  };
}
function digitsListCheck(digits, zeroPos, min) {
  return v => {
    const arr = String(v).split(/[,;\n]+/).map(s => s.replace(/\s/g, '')).filter(Boolean);
    if (!arr.length) return 'Запиши числа через кому.';
    const seen = new Set();
    for (const s of arr) {
      if (!/^\d{6}$/.test(s) || s[0] === '0') return `«${s}» – не шестицифрове число.`;
      if ([...s].some(ch => !digits.includes(ch))) return `У числі ${s} є цифра, якої немає в умові.`;

      seen.add(s);
    }
    if (seen.size < min) return `Правильних чисел: ${seen.size}. Їх значно більше – знайди щонайменше ${min}. Спробуй міняти цифри в одному розряді по черзі.`;
    return true;

  }

  space: ['Космос: що треба знати агентові', 'Науку, яка вивчає зорі, планети й увесь космос, називають астрономією. Астрономи роздивляються далекі небесні тіла через телескоп – прилад, що наближає й збільшує те, що дуже далеко.\nЦентр нашої Сонячної системи – Сонце. Це зоря, і вона така величезна, що важить більше, ніж усі планети разом. Після Сонця й Місяця найяскравіше на нічному небі світить планета Венера: її видно навіть без телескопа ввечері або перед світанком. Червонуватий Марс давні римляни назвали на честь свого бога війни.\n12 квітня 1961 року Юрій Гагарін став першою людиною, яка полетіла в космос. Перший космонавт незалежної України – Леонід Каденюк: 1997 року він полетів на американському кораблі «Колумбія». А поверхнею Місяця колись їздили самохідні апарати-місяцеходи, якими керували із Землі.'],

const ASGD = {};
function adAssign(ab, p) {
  const a = p.asg, live = a && !a.fin;
  const dr = ASGD[p.id] = ASGD[p.id] || { ids: new Set(live ? a.ids : []), custom: live ? a.custom.map(c => Object.assign({}, c)) : [] };
  const status = a ? `<div class="card"><h3>${a.fin ? '✓ Попередній наказ виконано' : 'Поточний наказ'} · від ${fmtDate(a.d)}</h3><ul class="clist">${a.ids.filter(id => TASK[id]).map(id => { const t = TASK[id]; return `<li>${taskState(p, id) === 'done' ? '✅' : '⬜'} ${SUBJ[t.s].short} · с. ${t.p}, № ${t.n} · ${esc(t.title)}</li>`; }).join('')}${a.custom.map((c, i) => `<li>${c.done ? (c.ok ? '✅' : '🟡') : '⬜'} ${esc(CSUBJ[c.s] || '')} · ${esc(c.x)}${c.done && !c.ok ? `<span class="sp"></span><button class="btn" data-cok="${i}">Підтвердити</button><button class="btn ghost" data-cback="${i}">Повернути</button>` : ''}</li>`).join('')}</ul><p class="note">${a.fin ? `Виконано ${fmtDate(a.fin)}. Новий наказ замінить цей.` : '🟡 – дитина позначила завдання виконаним. Підтвердіть, щоб нарахувати їй 15 кредитів, або поверніть на доопрацювання.'}</p></div>` : '';
  ab.innerHTML = `<div class="card"><h3>Наказ для ${esc(p.name)}</h3><p class="note">Позначте завдання, які задав учитель, і натисніть «Зберегти наказ». Після виходу з кабінету дитині будуть доступні лише вони; решта зошита, Тренувальна зала й Реванш відкриються, щойно наказ буде виконано. Сірим позначено вже виконані завдання.</p></div>${status}
  ${Object.keys(SUBJ).map(k => { const pages = [...new Set(TASKS.filter(t => t.s === k).map(t => t.p))], n = TASKS.filter(t => t.s === k && dr.ids.has(t.id)).length;
    return `<details class="card asub s-${k}" ${n ? 'open' : ''}><summary><b>${SUBJ[k].name}</b><span class="acount" data-acount="${k}"></span></summary>${pages.map(pg => `<div class="apage"><div class="aph"><b>Сторінка ${pg}</b><button type="button" class="opt sm" data-allpg="${pg}">Уся сторінка</button></div><div class="picks">${TASKS.filter(t => t.p === pg).map(t => { const dn = taskState(p, t.id) === 'done', on = dr.ids.has(t.id); return `<button type="button" class="pick ${on ? 'on' : ''}" data-pick="${t.id}" data-pg="${pg}" ${dn ? 'disabled' : ''}><i class="box">${on || dn ? '✓' : ''}</i><span><b>№ ${t.n}</b> ${esc(t.title)}</span>${dn ? '<small>виконано</small>' : ''}</button>`; }).join('')}</div></div>`).join('')}</details>`; }).join('')}
  <div class="card"><h3>Завдання не з цього зошита</h3><p class="note">Наприклад: «Підручник, с. 45, № 3». Дитина виконає його на папері й натисне «Готово», а ви підтвердите тут.</p><div class="row wrap"><select class="inp" id="cs"><option value="math">Математика</option><option value="ukr">Мова</option><option value="vs">Всесвіт</option><option value="other">Інше</option></select><input class="inp" id="ct" placeholder="Підручник, с. 45, № 3" maxlength="120" autocomplete="off" style="flex:1 1 200px"><button type="button" class="btn" id="cadd">Додати</button></div><ul class="clist" id="clist"></ul></div>
  <div class="asgbar"><span id="acnt"></span><button type="button" class="btn ghost" id="aclr">Очистити</button><button type="button" class="btn" id="asave">Зберегти наказ</button></div>`;
  const upd = () => { const n = dr.ids.size + dr.custom.length; $('#acnt').textContent = n ? `Обрано: ${n}` : 'Нічого не обрано'; Object.keys(SUBJ).forEach(k => { const c = TASKS.filter(t => t.s === k && dr.ids.has(t.id)).length; $(`[data-acount="${k}"]`).textContent = c ? `обрано ${c}` : ''; }); };
  const setPick = (b, on) => { b.classList.toggle('on', on); $('.box', b).textContent = on ? '✓' : ''; };
  const drawC = () => { $('#clist').innerHTML = dr.custom.map((c, i) => `<li><b>${esc(CSUBJ[c.s] || '')}</b> ${esc(c.x)}<button type="button" class="x2" data-crm="${i}" aria-label="Прибрати">✕</button></li>`).join(''); $$('[data-crm]', ab).forEach(b => b.onclick = () => { dr.custom.splice(+b.dataset.crm, 1); drawC(); upd(); }); };
  $$('[data-pick]', ab).forEach(b => b.onclick = () => { const id = b.dataset.pick; dr.ids.has(id) ? dr.ids.delete(id) : dr.ids.add(id); setPick(b, dr.ids.has(id)); upd(); });
  $$('[data-allpg]', ab).forEach(b => b.onclick = () => { const bs = $$(`[data-pick][data-pg="${b.dataset.allpg}"]:not(:disabled)`, ab), all = bs.length && bs.every(x => dr.ids.has(x.dataset.pick)); bs.forEach(x => { all ? dr.ids.delete(x.dataset.pick) : dr.ids.add(x.dataset.pick); setPick(x, !all); }); upd(); });
  $('#cadd').onclick = () => { const x = $('#ct').value.trim(); if (!x) return $('#ct').focus(); dr.custom.push({ id: 'c' + Date.now().toString(36), s: $('#cs').value, x, done: 0, ok: 0 }); $('#ct').value = ''; drawC(); upd(); };
  $('#ct').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); $('#cadd').click(); } };
  $('#aclr').onclick = () => { dr.ids.clear(); dr.custom.length = 0; $$('[data-pick]:not(:disabled)', ab).forEach(x => setPick(x, false)); drawC(); upd(); };
  $('#asave').onclick = () => {
    if (!dr.ids.size && !dr.custom.length) { if (p.asg && !p.asg.fin) { p.asg = null; save(p.id); toast('Наказ скасовано – зошит відкритий повністю.'); } else toast('Спершу позначте хоча б одне завдання.'); delete ASGD[p.id]; return adAssign(ab, p); }
    p.asg = { d: today(), ids: TASKS.filter(t => dr.ids.has(t.id)).map(t => t.id), custom: dr.custom.map(c => ({ id: c.id, s: c.s, x: c.x, done: c.done || 0, ok: c.ok || 0 })), fin: 0 };
    save(p.id); delete ASGD[p.id]; toast(`Наказ збережено: ${p.asg.ids.length + p.asg.custom.length} завд. Вийдіть з кабінету – дитина побачить його на головній.`); adAssign(ab, p); window.scrollTo(0, 0);
  };
  $$('[data-cok]', ab).forEach(b => b.onclick = () => { p.asg.custom[+b.dataset.cok].ok = 1; p.cr = (p.cr || 0) + 15; save(p.id); adAssign(ab, p); });
  $$('[data-cback]', ab).forEach(b => b.onclick = () => { const c = p.asg.custom[+b.dataset.cback]; c.done = 0; c.ok = 0; p.asg.fin = 0; save(p.id); delete ASGD[p.id]; adAssign(ab, p); });
  drawC(); upd();
}

/* ===== маршрутизація ===== */
const app = () => $('#app');

function route() {
  const h = (location.hash || '#home').slice(1); window.scrollTo(0, 0); CURTASK = null;
  if (h === 'adult') return header(true), viewAdult();
  if (!CUR || !P() || h === 'who') return header(true), viewWho();
  header();
  if (lockedFor(h)) return viewLocked();
  if (h === 'arsenal') return viewArsenal();
  if (h.startsWith('t-') && TASK[h.slice(2)]) return viewTask(h.slice(2), false);
  if (h.startsWith('r-') && TASK[h.slice(2)]) return viewTask(h.slice(2), true);
  if (h.startsWith('s-') && SUBJ[h.slice(2)]) return viewSubject(h.slice(2));
  if (h === 'trainer') return viewTrainer();
  if (h === 'garden') return viewGarden();
  viewHome();
}
window.addEventListener('hashchange', route);
function header(bare) {

  const parts = $('.parts');
  const dots = () => $('.dots').innerHTML = t.parts.map((_, i) => `<i class="${st.parts[i] && st.parts[i].ok ? 'on' : ''}"></i>`).join('');

/* ===== пошук ===== */
function findTasks(q) {
  q = q.trim().toLowerCase(); if (!q) return [];
  const nums = (q.match(/\d+(\.\d+)?|а\d/gi) || []);

function adOpen(ab, p) {
  const items = []; TASKS.forEach(t => { const s = p.tasks[t.id]; if (!s) return; t.parts.forEach((pt, i) => { if (pt.t === 'open' && s.parts[i] && s.parts[i].ok) items.push({ t, pt, i, ps: s.parts[i] }); }); });
  ab.innerHTML = items.length ? items.sort((a, b) => (a.ps.status === 'new' ? 0 : 1) - (b.ps.status === 'new' ? 0 : 1)).map((x, k) => `<div class="card oa"><small>${SUBJ[x.t.s].name} · ${label(x.t)} · ${esc(x.t.title)}</small><p class="oq">${x.pt.q}</p><blockquote>${esc(x.ps.val)}</blockquote><div class="row wrap"><span class="pill">${x.ps.status === 'ok' ? '✅ зараховано' : x.ps.status === 'back' ? '↩ повернено на доопрацювання' : '🆕 не переглянуто'}</span><button class="btn" data-ok="${k}">Зарахувати</button><input class="inp" placeholder="Коментар для дитини" data-cm="${k}" style="width:14em" value="${esc(x.ps.comment || '')}"><button class="btn ghost" data-back="${k}">Повернути на доопрацювання</button></div></div>`).join('') : '<div class="card">Дитина ще не зберегла жодної письмової відповіді.</div>';
  $$('[data-ok]', ab).forEach(b => b.onclick = () => { items[b.dataset.ok].ps.status = 'ok'; save(adultPid); adOpen(ab, p); });
  $$('[data-back]', ab).forEach(b => b.onclick = () => { const x = items[b.dataset.back]; x.ps.status = 'back'; x.ps.comment = $(`[data-cm="${b.dataset.back}"]`, ab).value.trim().slice(0, 200); save(adultPid); adOpen(ab, p); });
}
function adKey(ab) {
  ab.innerHTML = `<div class="card"><input class="inp wide" id="kq" placeholder="Пошук: номер, «21 5» або слово" autocomplete="off"><p class="note">Усього в каталозі ${TASKS.length} вправ зі сторінок 6–35 (${TASKS.reduce((a, t) => a + t.parts.length, 0)} інтерактивних частин). Сторінки 10 немає. Друкованого ключа зошит не містить: відповіді сформовано під час підготовки платформи; позначка ⚠ показує місця, які варто звірити з учителем.</p></div><div id="kl"></div>`;
  const run = () => { const q = $('#kq').value, r = q.trim() ? findTasks(q) : TASKS; $('#kl').innerHTML = r.map(t => `<details class="card key s-${t.s}"><summary><b>${label(t)}</b> · ${SUBJ[t.s].short} · ${esc(t.title)} ${t.verify ? '⚠' : ''}${t.audit ? ' · селфі-аудит' : ''}</summary><p class="ttext">${t.text}</p>${t.verify ? `<p class="warnbox">⚠ ${esc(t.verify)}</p>` : ''}<ol>${t.parts.map(pt => `<li>${pt.bonus ? '<span class="tag">бонус</span> ' : ''}${pt.q}<br><span class="ans">Ключ: ${esc(keyOf(pt))}</span></li>`).join('')}</ol><a class="btn ghost" href="#t-${t.id}">Відкрити вправу</a></details>`).join('') || '<div class="card">Нічого не знайдено.</div>'; };
  $('#kq').oninput = run; run();
}
function adClass(ab) {
  ab.innerHTML = `<div class="card"><div class="tw"><table class="tbl"><tr><th>Учень</th><th>Виконано</th><th>Мова</th><th>Математика</th><th>Всесвіт</th><th>З першої спроби</th><th>Повторення</th><th>Остання активність</th></tr>${DB.order.map(id => { const p = DB.profiles[id], s = summary(p), pt = partTotals(p), ld = Object.keys(p.days).sort().pop() || '–'; return `<tr><td><span class="av">${avHTML(p.av, kitOf(p))}</span> ${esc(p.name)}</td><td>${s.done}/${TASKS.length}</td>${Object.keys(SUBJ).map(k => `<td>${subjProg(p, k).join('/')}</td>`).join('')}<td>${pt.n ? Math.round(pt.first / pt.n * 100) : 0}%</td><td>${reviewList(p).length}</td><td>${ld}</td></tr>`; }).join('')}</table></div><p class="note">Щоб вести клас на одному пристрої, створіть профіль для кожного учня. Для перенесення результатів між пристроями скористайтеся експортом на вкладці «Налаштування й дані».</p></div>`;
}
function adData(ab, p) {
  ab.innerHTML = `<div class="card"><h3>Рівень підтримки для ${esc(p.name)}</h3><div class="row wrap"><button class="opt ${p.support === 1 ? 'on' : ''}" data-sup="1">Підказка після першої помилки</button><button class="opt ${p.support === 2 ? 'on' : ''}" data-sup="2">Після другої помилки</button><button class="opt ${p.support === 9 ? 'on' : ''}" data-sup="9">Лише на прохання дитини</button></div><p class="note">Правильну відповідь програма дитині не показує за жодного рівня.</p></div>
  <div class="card"><h3>Перенесення даних</h3><p class="note">Стан: ${cloudState === 'ok' ? 'прогрес зберігається в хмарі цієї сторінки й доступний з інших пристроїв під тим самим обліковим записом.' : 'прогрес зберігається лише в цьому браузері. Зробіть копію, щоб не втратити його.'}</p><textarea class="inp area" id="exp" rows="4" readonly></textarea><div class="row wrap"><button class="btn" id="bexp">Показати й скопіювати копію профілю</button></div><textarea class="inp area" id="imp" rows="3" placeholder="Вставте сюди скопійований текст профілю"></textarea><div class="row wrap"><button class="btn ghost" id="bimp">Імпортувати профіль</button></div><div class="fb" id="dfb" hidden></div></div>
  <div class="card"><h3>Змінити PIN-код</h3><div class="row wrap"><input class="inp" id="pold" type="password" inputmode="numeric" maxlength="8" placeholder="старий PIN" autocomplete="off" style="width:9em"><input class="inp" id="pnew" type="password" inputmode="numeric" maxlength="8" placeholder="новий PIN" autocomplete="off" style="width:9em"><button class="btn" id="bpin">Змінити PIN</button></div><div class="fb" id="pfb" hidden></div><p class="note">4–8 цифр. Змініть PIN, якщо дитина його дізналася.</p></div>
  <div class="card"><h3>Небезпечні дії</h3><div class="row wrap"><button class="btn ghost" data-danger="reset">Скинути прогрес учня</button><button class="btn ghost" data-danger="del">Видалити профіль</button><button class="btn ghost" data-danger="pin">Скинути PIN-код</button></div></div>`;
  const fb = (c, t) => { const f = $('#dfb'); f.hidden = false; f.className = 'fb ' + c; f.textContent = t; };
  $('#bpin').onclick = () => { const o = $('#pold').value.trim(), n = $('#pnew').value.trim(), f = $('#pfb'), say = (c, t) => { f.hidden = false; f.className = 'fb ' + c; f.textContent = t; }; if (pinHash(o) !== DB.pin) return say('bad', 'Старий PIN неправильний.'); if (!/^\d{4,8}$/.test(n)) return say('bad', 'Новий PIN має складатися з 4–8 цифр.'); if (n === o) return say('bad', 'Новий PIN збігається зі старим.'); DB.pin = pinHash(n); save(); $('#pold').value = $('#pnew').value = ''; say('good', 'PIN змінено.'); };
  $$('[data-sup]', ab).forEach(b => b.onclick = () => { p.support = +b.dataset.sup; save(adultPid); adData(ab, p); });
  $('#bexp').onclick = async () => { $('#exp').value = JSON.stringify(p); try { await navigator.clipboard.writeText($('#exp').value); fb('good', 'Скопійовано в буфер обміну.'); } catch (e) { $('#exp').select(); fb('tip', 'Виділіть текст у полі та скопіюйте його вручну.'); } };
  $('#bimp').onclick = () => { try { const o = JSON.parse($('#imp').value); if (!o.id || !o.tasks || !o.name) throw 0; o.rev = Date.now(); delete DB.deleted[o.id]; DB.profiles[o.id] = o; if (!DB.order.includes(o.id)) DB.order.push(o.id); save(o.id); save(); adultPid = o.id; fb('good', `Профіль «${o.name}» імпортовано.`); } catch (e) { fb('bad', 'Не вдалося прочитати текст. Вставте копію профілю повністю.'); } };
  $$('[data-danger]', ab).forEach(b => b.onclick = () => {
    if (!b.dataset.armed) { b.dataset.armed = 1; b.textContent = 'Натисніть ще раз для підтвердження'; b.classList.add('arm'); return; }
    const k = b.dataset.danger;
    if (k === 'reset') { Object.assign(p, { xp: 0, tasks: {}, days: {}, badges: {}, claimed: {}, gen: {}, last: null, stat: { persist: 0, hard: 0, panel: 0, solid: 0, streak1: 0 } }); save(adultPid); }
    if (k === 'del') { delete DB.profiles[adultPid]; DB.deleted[adultPid] = Date.now(); DB.order = DB.order.filter(x => x !== adultPid); dirty.add('p:' + adultPid); if (CUR === adultPid) CUR = null; adultPid = null; save(); }
    if (k === 'pin') { DB.pin = null; save(); adultOpen = false; }
    viewAdult();
  });
}

/* ===== вигляд: телефон / компʼютер ===== */
function applyView() { let m = 'auto'; try { m = localStorage.getItem(LS + ':view') || 'auto'; } catch (e) { } document.body.classList.toggle('mob', m === 'mob' || (m === 'auto' && window.matchMedia('(max-width:700px)').matches)); }
function setView(m) { try { localStorage.setItem(LS + ':view', m); } catch (e) { } applyView(); }
window.addEventListener('resize', () => { const was = document.body.classList.contains('mob'); applyView(); if (was !== document.body.classList.contains('mob')) header(!CUR || location.hash === '#adult'); });

/* ===== старт ===== */
document.addEventListener('DOMContentLoaded', () => { applyView(); route(); initCloud(); });

</script>
</body>
</html>
