<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111417">
<title>Штаб героїв</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>:root{
  /* Світ: світла лука з метеликами; кожен предмет має колір свого розділу в зошиті. Одна тема за задумом. */
  --bg:#f2f6ff; --card:#ffffff; --ink:#1c2340; --mute:#5d668a; --line:#dbe2f5;
  --ukr:#e23e68; --math:#2a66d9; --vs:#17966a; --sun:#ffbf3c; --good:#17966a; --bad:#d8433b;
  --acc:var(--math);
  --display:'Unbounded','Trebuchet MS',sans-serif; --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg) radial-gradient(1200px 500px at 80% -10%,#ffe9f0 0,transparent 60%) no-repeat;color:var(--ink);font:17px/1.5 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(22px,4.5vw,32px)} h2{font-size:18px;margin:28px 0 12px} h3{font-size:15px;margin-bottom:10px}
a{color:inherit} button{font:inherit;color:inherit;cursor:pointer} img{max-width:100%}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.s-ukr{--acc:var(--ukr)} .s-math{--acc:var(--math)} .s-vs{--acc:var(--vs)}
#hd{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:700;text-decoration:none;font-size:15px;white-space:nowrap}
.me{display:flex;gap:8px;align-items:center;text-decoration:none;min-width:0}
.av{font-size:26px;line-height:1}.av.big{font-size:48px}
.mi{display:grid;font-size:13px;line-height:1.2;min-width:90px}.mi small{color:var(--mute)}
.xpbar,.bar{display:block;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.xpbar i,.bar i{display:block;height:100%;background:var(--acc);border-radius:8px}.xpbar i{background:var(--sun)}
nav{display:flex;gap:4px}.ib{border:0;background:none;font-size:20px;padding:6px 8px;border-radius:10px;text-decoration:none}.ib:hover{background:var(--bg)}
main{max-width:860px;margin:0 auto;padding:16px 16px 80px}
.hero{padding:14px 0 6px}.hero p{color:var(--mute);margin:6px 0 0;max-width:62ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:block;text-decoration:none}
.cont{display:grid;gap:4px;border-left:8px solid var(--acc);position:relative;margin-top:12px}.cont small,.cont span{color:var(--mute)}.cont b{font-family:var(--display);font-size:18px}.cont .btn{justify-self:start;margin-top:8px;font-style:normal}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.sub{display:grid;gap:6px;text-align:left;border-top:6px solid var(--acc)}.sub small{color:var(--mute)}.sico{font-size:30px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;padding:10px 16px;text-decoration:none;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}.btn.big{font-size:18px;padding:12px 22px}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}.btn.arm{border-color:var(--bad);color:var(--bad)}.btn:disabled{opacity:.5}
.back{display:inline-block;border:0;background:none;color:var(--mute);text-decoration:none;font-weight:700;padding:4px 0}
.chip{display:block;width:max-content;margin:0 auto 20px;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--mute)}.chip.ok{color:var(--good)}.chip.err{color:var(--bad)}
.missions{display:grid;gap:12px}.mis{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.mis small{color:var(--mute);display:block}.mis em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums}.mis.ok b{color:var(--good)}
.who{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}.pcard{display:grid;justify-items:center;gap:2px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px 20px;min-width:140px}.pcard small{color:var(--mute)}
.newp{display:grid;gap:12px;max-width:420px}.avs,.row{display:flex;gap:8px;align-items:center}.row.wrap,.avs{flex-wrap:wrap}
.avb{font-size:28px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 10px}.avb.on{border-color:var(--sun);background:#fff7e0}.avb:disabled{opacity:.45}
.pg{margin-top:12px;border-left:8px solid var(--acc)}.pgh{display:flex;justify-content:space-between;margin-bottom:10px}.pgh span{color:var(--mute)}
.tl{display:flex;flex-wrap:wrap;gap:8px}.tl.col{flex-direction:column;margin-top:12px}
.tchip{display:inline-flex;gap:8px;align-items:baseline;border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-decoration:none;font-size:15px;background:#fff}
.tchip em{font-style:normal;font-weight:800;color:var(--acc);white-space:nowrap}.tchip.done{background:#e6f6ee;border-color:#a9dcc4}.tchip.part{background:#e8f0ff;border-color:#b3c8f5}.tchip.warn{background:#fff4d6;border-color:#f2cf73}
.miss{margin-top:12px;color:var(--mute);border-style:dashed}
.task .th{display:grid;gap:8px}.tmeta,.tbtns{display:flex;flex-wrap:wrap;gap:6px}
.pill,.tag{display:inline-block;font-size:12px;font-weight:800;border-radius:20px;padding:2px 10px;background:color-mix(in srgb,var(--acc) 14%,#fff);color:var(--acc)}
.tag{background:#fff3cf;color:#8a5a00}.tag.aud{background:#e9e4ff;color:#4b3aa8}.pill.rv{background:#fff3cf;color:#8a5a00}
.ttext{margin:0;max-width:68ch}.ttext b{color:var(--acc)}
.cropbox{margin:14px 0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 12px}.cropbox summary{font-weight:800;color:var(--mute);cursor:pointer;font-size:14px}
.crop{position:relative;overflow:hidden;width:100%;border-radius:10px;margin-top:8px;max-height:none}.crop img{position:absolute;max-width:none;height:auto}.crop.full img{position:static;width:100%;max-width:100%}
.parts{display:grid;gap:14px}
.part{background:#fff;border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:12px}.part.done{border-color:#a9dcc4;background:#f4fbf7}.part.bonus{border-style:dashed}
.ph{display:flex;gap:10px;align-items:flex-start}.pn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800}.part.done .pn{background:var(--good)}.pq{font-weight:700}
.pact{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{font:inherit;border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;color:var(--ink);max-width:100%}.inp.wide,.inp.area{width:100%}.inp.bad,.cw input.bad,.colg input.bad{border-color:var(--bad);background:#ffecea}.inp.good,.colg input.good{border-color:var(--good);background:#e6f6ee}
.fields{display:grid;gap:8px}.fields.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}.fld{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.fld span{flex:1 1 140px}
.opts{display:grid;gap:8px}.opts.inline{display:flex;flex-wrap:wrap}
.opt{text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:600}.opt.sm{padding:5px 10px;font-size:14px}
.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,#fff)}.opt.bad{border-color:var(--bad);background:#ffecea}.opt.ok{border-color:var(--good);background:#e6f6ee}.opt:disabled{opacity:.75;cursor:default}
.multi .opt.on::before{content:'✓ '}
.mhint,.note{font-size:13.5px;color:var(--mute);margin:4px 0}
.match .ml{display:grid;gap:8px}.mrow{display:grid;gap:2px;text-align:left;border:2px dashed var(--line);border-radius:12px;padding:8px 12px;background:#fff}.mrow span{color:var(--mute)}.mrow.set{border-style:solid}.mrow.set span{color:var(--ink)}.mrow.act{border-color:var(--sun);background:#fffaea}
.mr,.pool{display:grid;gap:8px}
.seq{margin:0;padding-left:26px;display:grid;gap:6px;min-height:20px}.seq .opt{width:100%}
.crow{display:grid;gap:6px;padding:8px;border-radius:12px;border:2px solid transparent}.crow+.crow{border-top-color:var(--line);border-radius:0}.crow.bad{border-color:var(--bad);border-radius:12px;background:#fff6f5}.cbtns{display:flex;flex-wrap:wrap;gap:6px}
.gaps{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:19px}.gap{white-space:nowrap}.inp.g{padding:3px 4px;text-align:center;margin:0 1px}
.cwwrap{display:grid;gap:12px}.cw{display:grid;gap:2px;max-width:480px}.cw i{aspect-ratio:1}.cc{position:relative;aspect-ratio:1}.cc input{width:100%;height:100%;border:2px solid #9cc4f0;border-radius:4px;text-align:center;font:800 clamp(13px,3.6vw,18px) var(--body);padding:0;text-transform:uppercase;background:#fff;color:var(--ink)}.cc sup{position:absolute;left:2px;top:-1px;font-size:9px;font-weight:800;color:var(--acc)}
.clues{margin:0;padding-left:22px;display:grid;gap:4px;font-size:15px}.clues em{color:var(--mute);font-size:13px}
.scaf{display:grid;gap:8px;background:#fffaea;border-radius:12px;padding:10px}.scaf p{margin:0;font-size:14px}
.fb{border-radius:12px;padding:10px 12px;font-size:15.5px}.fb.good{background:#e6f6ee;color:#0d5c40}.fb.bad{background:#fff1ef;color:#7c2a25}.fb.tip{background:#fffaea;color:#6b4a00}.hint{margin-top:6px}.again{margin-top:4px;font-weight:800}
.membox .memt{font-weight:800;color:var(--acc)}
.drawtools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.drawarea{position:relative;border:2px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none;background:#fff}.drawarea .crop{margin:0;border-radius:0;position:absolute;inset:0;height:100%}.drawarea canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.gridbg{background-image:linear-gradient(#bfe0fb 1px,transparent 1px),linear-gradient(90deg,#bfe0fb 1px,transparent 1px);background-size:6.25% 9.09%}
.tnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:8px}.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--good)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(20,26,60,.45);display:grid;place-items:center;padding:12px;overflow:auto}
.sheet{background:#fff;border-radius:20px;padding:20px;width:min(560px,100%);position:relative;max-height:94vh;overflow:auto}.sheet.wide{width:min(820px,100%)}
.x{position:absolute;right:10px;top:10px;border:0;background:var(--bg);border-radius:50%;width:34px;height:34px}
.cele{text-align:center;display:grid;gap:10px;justify-items:center}.fly{font-size:40px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.pagewrap{overflow:auto;max-height:78vh}.pagewrap img{width:100%;min-width:560px}
#toasts{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;display:grid;gap:6px;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:8px 14px;text-align:center;font-weight:700;font-size:15px;animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
.garden{position:relative;height:260px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}.bf{position:absolute;font-size:30px;animation:bob 3s ease-in-out infinite}.gme{position:absolute;left:46%;bottom:10px;font-size:46px}.gempty{position:absolute;inset:auto 16px 70px;text-align:center;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.badge{display:grid;gap:2px;justify-items:center;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;opacity:.45;filter:grayscale(1)}.badge.on{opacity:1;filter:none;border-color:var(--sun)}.badge span{font-size:30px}.badge small{color:var(--mute);font-size:12.5px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:grid}.tile b{font:700 22px var(--display);font-variant-numeric:tabular-nums}.tile span{font-size:13px;color:var(--mute)}
#ab .card{margin-bottom:12px}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.two ul,.key ol{margin:0;padding-left:20px}
.srow{display:grid;gap:4px;margin-bottom:10px}.srow span:last-child{font-size:13.5px;color:var(--mute)}
.chart{width:100%;height:auto}.chart .gr{stroke:var(--line)}.chart .ax{font:10px var(--body);fill:var(--mute)}.chart .ax.b{fill:var(--ink);font-weight:800}.bc{fill:var(--good);background:var(--good)}.bw{fill:#f0a59f;background:#f0a59f}.lg{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:8px}
.pgrow{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.oa blockquote{margin:8px 0;padding:10px 12px;background:var(--bg);border-radius:12px;white-space:pre-wrap}.oq{margin:4px 0;font-weight:700}
.key summary{cursor:pointer}.key li{margin:6px 0}.ans{color:var(--good);font-weight:700}.warnbox{background:#fff4d6;border-radius:10px;padding:8px 10px;font-size:14px}
.tw{overflow-x:auto}.tbl{border-collapse:collapse;width:100%;font-size:14.5px;font-variant-numeric:tabular-nums}.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
.gate{max-width:420px;display:grid;gap:10px;margin-top:12px}
.colg{border-collapse:collapse;margin:12px 0;background-image:linear-gradient(#cfe6fb 1px,transparent 1px),linear-gradient(90deg,#cfe6fb 1px,transparent 1px);background-size:38px 38px}
.colg td{width:38px;height:38px;text-align:center;font:700 22px var(--body);padding:0;font-variant-numeric:tabular-nums}.colg input{width:34px;height:34px;border:2px solid #9cc4f0;border-radius:6px;text-align:center;font:700 20px var(--body);padding:0;background:#fff;color:var(--ink)}
.colg .carry td{height:26px}.colg .carry input{height:22px;width:26px;font-size:12px;border-style:dashed;color:var(--mute)}.colg .line td{height:3px;background:var(--ink)}
.steps{padding-left:22px;display:grid;gap:6px;font-size:15px}.divl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:12px 0}.divl .big{font:700 22px var(--body)}
.freeg{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));max-width:560px;margin:8px 0;border-left:1px solid #9cc4f0;border-top:1px solid #9cc4f0}.freeg input{aspect-ratio:1;width:100%;border:0;border-right:1px solid #9cc4f0;border-bottom:1px solid #9cc4f0;text-align:center;font:700 clamp(13px,3.4vw,19px) var(--body);padding:0;border-radius:0;background:#fff;color:var(--ink)}
.roz{border-collapse:collapse;margin:12px 0;width:100%;max-width:560px}.roz th,.roz td{border:1px solid var(--line);text-align:center;padding:4px}.roz .sm{font-size:11px;color:var(--mute)}.roz .dg{font:700 22px var(--body)}.c1{color:#7a3fa0}.c2{color:var(--vs)}.c3{color:var(--bad)}
@media (max-width:520px){.logo span{display:none}body{font-size:16px}.pgrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.helpbox{background:#fffaea;border:2px solid var(--sun);border-radius:14px;padding:10px 14px}.helpbox p{margin:6px 0 0;max-width:68ch}
.padb{border:2px solid var(--line);background:#fff;border-radius:10px;padding:5px 7px;font-size:16px}
.fld.pre{justify-content:flex-start}.fld.pre .inp{flex:1 1 220px}
.sol{display:grid;gap:8px}.solrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px;border-radius:12px;border:2px solid transparent}.solrow.bad{border-color:var(--bad);background:#fff6f5}.solrow .se{width:11em}.solrow .sr{width:6.5em}.solrow .sk{flex:1 1 200px;min-width:0}
.padwrap{overflow-x:auto;margin:12px 0}.pgrid{display:grid;width:max-content;background-image:linear-gradient(#cfe6fb 1px,transparent 1px),linear-gradient(90deg,#cfe6fb 1px,transparent 1px);background-size:36px 36px;border-right:1px solid #cfe6fb;border-bottom:1px solid #cfe6fb}
.pc{width:36px;height:36px;display:grid;place-items:center;font:700 22px var(--body);font-variant-numeric:tabular-nums;color:var(--ink)}.pc.in{color:#2a3fb5}.pc.dn{color:#2a3fb5}.pc.mk{font-size:12px;color:var(--bad);align-items:end;padding-bottom:1px}.pc.ul{border-bottom:3px solid var(--ink)}.pc.br{border-right:3px solid var(--ink)}.pc.act{background:#ffe89a;outline:2px solid var(--sun);outline-offset:-2px}
.keypad{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;max-width:360px;margin-top:10px}.key{border:2px solid var(--line);background:#fff;border-radius:12px;font:800 20px var(--body);padding:8px 0}.key:active{background:var(--bg)}
.parts{grid-template-columns:minmax(0,1fr)}.part{min-width:0}.part>*{min-width:0}.solrow .sk{width:100%;max-width:100%}.fields .fld{min-width:0}

.book{margin:14px 0;background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;color:var(--mute)}.book b{color:var(--ink)}.book.need{border-color:var(--sun);background:#fffaea;color:#6b4a00}
.zig pre{font:700 18px/1.5 ui-monospace,Menlo,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;overflow-x:auto;margin:6px 0}.zig p{margin:4px 0;font-size:14px;color:var(--mute)}
.ciph td,.ciph th{text-align:center;font-weight:700}.memlist{font-weight:700;font-size:18px;padding-left:24px}
#cloud{display:none}
#bn{display:none}
body.mob{font-size:17px}
body.mob #bn:not([hidden]){display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#bn a,#bn button{display:grid;justify-items:center;gap:0;border:0;background:none;text-decoration:none;font-size:11.5px;font-weight:800;color:var(--mute);padding:4px 0;border-radius:12px}#bn i{font-style:normal;font-size:22px;line-height:1.1}#bn .on{color:var(--math);background:var(--bg)}
body.mob main{padding:10px 12px 96px}body.mob #hd{padding:6px 10px;gap:6px}body.mob #bsearch,body.mob #bpanel,body.mob #bbooks,body.mob .logo span{display:none}
body.mob .btn{min-height:48px;padding:12px 18px}body.mob .opt{padding:12px 14px;min-height:46px}body.mob .opt.sm{padding:9px 12px;min-height:40px}
body.mob .inp{font-size:17px;padding:10px}body.mob .part{padding:12px;border-radius:16px}body.mob .pact .btn:first-child{flex:1 1 100%;justify-content:center}
body.mob .subs{grid-template-columns:1fr 1fr}body.mob .tchip{width:100%}body.mob .fld{flex-direction:column;align-items:stretch}body.mob .fld span{flex:none}body.mob .fld .inp{width:100%!important}body.mob .fields.grid{grid-template-columns:1fr 1fr}
body.mob .fld:has(.padb){display:grid;grid-template-columns:1fr auto}body.mob .fld:has(.padb) span{grid-column:1/-1}
body.mob .solrow .se{flex:1 1 9em;width:auto}body.mob .keypad{grid-template-columns:repeat(4,1fr);max-width:none}body.mob .key{padding:12px 0;font-size:22px}
body.mob .sheet{padding:16px 12px;border-radius:18px}body.mob .modal{padding:6px;place-items:end center}body.mob .tnav .btn{min-height:42px;padding:8px 12px}
body.mob .tbtns .btn{min-height:40px;padding:8px 12px;font-size:15px}
body.mob .gaps{font-size:20px;gap:12px 16px}body.mob .inp.g{width:2.2em!important}

/* ---- яскравіший вигляд, герої, анімації ---- */

:root{--bg:#f4f5f7;--card:#fff;--ink:#111417;--mute:#8a919b;--line:#e2e5ea;--ukr:#111417;--math:#111417;--vs:#111417;--sun:#c99700;--good:#15803d;--bad:#c2410c;--acc:#111417;

#clip{border-radius:999px}

<script>
/* Каталог вправ зошита (с. 6–35; с. 10 у скані відсутня).
   Координати crop – у пікселях скану 992×1403. */
const SUBJ = {
  ukr: { name: 'Українська мова', short: 'Мова', pages: [6, 19], ico: '' },
  math: { name: 'Математика', short: 'Математика', pages: [20, 29], ico: '' },
  vs: { name: 'Всесвіт', short: 'Всесвіт', pages: [30, 35], ico: '' },
  eng: { name: 'Англійська мова', short: 'English', pages: [4, 105], ico: '', book: 'Student’s Book' }
};
const MISSING_PAGES = [10];

/* ---- короткі конструктори частин ---- */
const N = (q, a, hints, x) => Object.assign({ t: 'num', q, a, hints }, x);
const T = (q, a, x) => Object.assign({ t: 'text', q, a: [].concat(a) }, x);
const C = (q, o, a, x) => Object.assign({ t: 'choice', q, o, a }, x);
const M = (q, o, a, x) => Object.assign({ t: 'multi', q, o, a }, x);
const F = (q, f, x) => Object.assign({ t: 'fields', q, f }, x);
const MT = (q, l, r, x) => Object.assign({ t: 'match', q, l, r }, x); // r[i] – пара до l[i]
const OR = (q, items, x) => Object.assign({ t: 'order', q, items }, x); // items у правильному порядку
const CL = (q, cats, items, a, x) => Object.assign({ t: 'classify', q, cats, items, a }, x);
const O = (q, x) => Object.assign({ t: 'open', q }, x);
const S = (q, x) => Object.assign({ t: 'self', q }, x);
const D = (q, x) => Object.assign({ t: 'draw', q }, x);
const ST = (q, a, scaffold, hints, x) => Object.assign({ t: 'steps', q, a, scaffold, hints }, x);
const AUD = (shown, ok, why) => C(`У зошиті вже записано відповідь: <b>${shown}</b>. Вона правильна?`,
  ['Так, усе правильно', 'Ні, там помилка'], ok ? 0 : 1,
  { why: ok ? [null, 'Перевір ще раз самостійно: порівняй свою відповідь із записаною.'] : [why || 'Порівняй записане зі своєю відповіддю – вони збігаються?', null], audit: true });
const B = p => Object.assign(p, { bonus: true });

const ROM = { 15: 'XV', 16: 'XVI', 18: 'XVIII', 19: 'XIX', 20: 'XX', 21: 'XXI' };
const CENT_H = ['Століття – це 100 років. I століття – роки 1–100, II – роки 101–200.',

function expandCheck(target) {
  return v => {
    const parts = String(v).replace(/\s/g, '').split('+').filter(Boolean).map(Number);
    if (parts.length < 2 || parts.some(isNaN)) return 'Запиши число як суму, наприклад: 3000+200+5.';
    if (parts.reduce((a, b) => a + b, 0) !== target) return 'Сума доданків не дорівнює вибраному числу. Перевір кожен розряд.';
    if (parts.some(p => !/^[1-9]0*$/.test(String(p)))) return 'Розрядний доданок має лише одну цифру, що не є нулем: 200 000, 30 000, 5000… Розклади число на такі доданки.';
    return true;
  };
}
function digitsListCheck(digits, zeroPos, min) {
  return v => {
    const arr = String(v).split(/[,;\n]+/).map(s => s.replace(/\s/g, '')).filter(Boolean);
    if (!arr.length) return 'Запиши числа через кому.';
    const seen = new Set();
    for (const s of arr) {
      if (!/^\d{6}$/.test(s) || s[0] === '0') return `«${s}» – не шестицифрове число.`;
      if ([...s].some(ch => !digits.includes(ch))) return `У числі ${s} є цифра, якої немає в умові.`;
      if (zeroPos.some(p => s[p] !== '0')) return `У числі ${s} у потрібному розряді стоїть не 0. Згадай порядок розрядів: сотні тисяч, десятки тисяч, одиниці тисяч, сотні, десятки, одиниці.`;
      seen.add(s);
    }
    if (seen.size < min) return `Правильних чисел: ${seen.size}. Їх значно більше – знайди щонайменше ${min}. Спробуй міняти цифри в одному розряді по черзі.`;
    return true;
  };
}

/* ================= ENGLISH (Student's Book, starter + units 1–8) ================= */
const ENG = [];
const EA = (p, n, topic, title, text, parts, x) => ENG.push(Object.assign({ id: 'e' + p + '-' + n, p: 1000 + p, n: String(n), s: 'eng', topic, title, text, parts }, x));
const AU = (tr, what, lab) => S(`🎧 Аудіо ${tr}. ${what}`, { label: lab || 'Виконав(ла) з аудіо' });
const SAY = (what, lab) => S(`🗣 ${what}`, { label: lab || 'Готово' });
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const anyMonth = v => MONTHS.some(m => normWord(v).includes(m.toLowerCase())) ? true : 'Напиши назву місяця англійською, наприклад: It’s in May.';
const minWords = (n, must) => v => { const w = normWord(v).split(' ').filter(Boolean); if (must && !must.test(normWord(v))) return 'Перевір, чи використано потрібну конструкцію з прикладу.'; return w.length >= n ? true : `Напиши повне речення англійською – щонайменше ${n} слів.`; };

const RULES = {
  have: { t: 'have / has – описуємо зовнішність', h: RT([['I / You / We / They', '<b>have</b>', 'dark hair.'], ['He / She / It', '<b>has</b>', 'curly hair.'], ['I / You / We / They', '<b>don’t have</b>', 'glasses.'], ['He / She / It', '<b>doesn’t have</b>', 'freckles.']]) + '<p>Питання про зовнішність: <b>What does she look like?</b> – Як вона виглядає?</p>',

  haveQ: { t: 'Do / Does … have? – питання й короткі відповіді', h: RT([['<b>Do</b> you / they <b>have</b> …?', 'Yes, I <b>do</b>. / No, they <b>don’t</b>.'], ['<b>Does</b> he / she <b>have</b> …?', 'Yes, she <b>does</b>. / No, he <b>doesn’t</b>.']]) + '<p>⚠️ Не кажи «No, he hasn’t» – на питання з <b>does</b> відповідаємо <b>does / doesn’t</b>.</p>',

K12(6, 1, 'ukr', 'Текст і стиль', 'Ода спорту', '<b>Прочитай</b> «Оду спорту» П’єра де Кубертена в паперовому зошиті і <b>запиши</b> номери слів, яких не вистачає в назвах частин твору. <b>Поясни</b> свій вибір.<br>1 – радість; 2 – мир; 3 – благородство; 4 – справедливість.', [

    { l: 'Частина 2 (ліворуч унизу: «І рев трибун, овацій грім…»)', a: 3 },
    { l: 'Частина 3 (праворуч угорі: «Окраса нашого життя…»)', a: 1 },

K12(7, 2, 'ukr', 'Звуки й букви', 'Прислів’я в ланцюжку', '<b>Наведи</b> в записі кожне слово ручкою іншого кольору. <b>Поясни</b> свій вибір.', [

K12(7, 4, 'ukr', 'Лексичне значення', 'Слово і значення', '<b>Запиши</b> номери слів відповідно до номерів пояснень їхніх лексичних значень.<br>1. Той, хто систематично займається спортом. 2. Шкільний предмет, що має на меті фізичне виховання учнів. 3. Фізичні вправи, які виконуються з метою оздоровлення організму. 4. Забава.', [

K12(17, 4, 'ukr', 'Пунктуація', 'Коми при порівнянні', '<b>Прочитай</b> правило: порівняння в реченнях виокремлюють комами (Спринтер біг швидко, як блискавка). <b>Запиши</b> в тексті коми, яких не вистачає. <b>Поясни</b> свій вибір.', [
  T('Перепиши текст із комами: «Щоб бути шахістом треба мати не тільки гострий мов лезо розум а й нерви мов сталеві канати. Саме такі якості притаманні українському спортсмену наймолодшому чемпіону світу Руслану Пономарьову. Він здобував одну перемогу за одною ніби горішки лускав.» Текст уже вписано – постав коми просто в ньому.', ['Щоб бути шахістом, треба мати не тільки гострий, мов лезо, розум, а й нерви, мов сталеві канати. Саме такі якості притаманні українському спортсмену, наймолодшому чемпіону світу Руслану Пономарьову. Він здобував одну перемогу за одною, ніби горішки лускав.'], {
    wide: true, area: true, fill: 'Щоб бути шахістом треба мати не тільки гострий мов лезо розум а й нерви мов сталеві канати. Саме такі якості притаманні українському спортсмену наймолодшому чемпіону світу Руслану Пономарьову. Він здобував одну перемогу за одною ніби горішки лускав.', check: v => { const s = String(v).replace(/\s+/g, ' ').replace(/[’']/g, '’').toLowerCase();
      const need = [['шахістом,', 'Після «Щоб бути шахістом» потрібна кома.'], ['гострий, мов лезо, розум', 'Порівняння «мов лезо» виокремлюємо комами з обох боків.'], ['розум, а й', 'Перед «а й» ставимо кому.'], ['нерви, мов сталеві канати', 'Перед порівнянням «мов сталеві канати» – кома.'], ['спортсмену, наймолодшому', 'Слова «наймолодшому чемпіону світу» пояснюють «спортсмену» – відокрем їх комою.'], ['одною, ніби', 'Перед порівнянням «ніби горішки лускав» – кома.']];
      const miss = need.find(([k]) => !s.includes(k)); return miss ? miss[1] : true; },
    hints: ['Шукай слова мов, ніби – перед ними (і після порівняння, якщо речення продовжується) потрібні коми.', 'Ще кома потрібна після вступу «Щоб бути шахістом» і перед «а й».'] })],
  { verify: 'Ключ: «Щоб бути шахістом, треба мати не тільки гострий, мов лезо, розум, а й нерви, мов сталеві канати. … українському спортсмену, наймолодшому чемпіону світу Руслану Пономарьову. … одну перемогу за одною, ніби горішки лускав.» Кому після «спортсмену» перевірка вимагає – за потреби зарахуйте вручну.' });

K12(20, 2, 'math', 'Множення й ділення круглих чисел', 'Скільки дітей грає у футбол', '<b>З’єднай</b> лініями вирази з картками із записами обчислення подібних виразів. <b>Обчисли</b> вирази. <b>Обведи</b> число, яке містить 33 десятки класу тисяч, і <b>дізнайся</b> кількість дітей в Україні віком від 8 до 14 років, які займаються футболом.', [

  CL('Як обчислюєш? З’єднай вираз зі зразком.', ['3 тис. · 4 = 12 тис.', '2 тис. · 600 = 1 200 тис.', '51 сот. : 17 = 3 сот.', '840 сот. : 7 сот. = 120'],
    ['6000 : 4', '12 000 · 3', '40 000 : 50', '400 · 200', '16 000 : 8', '8400 · 40', '108 000 : 120', '370 · 600'], [2, 0, 3, 1, 2, 1, 3, 1],
    { verify: 'Відповідність «вираз – картка» в зошиті не позначена (дитина з’єднала лише 6000 : 4 з карткою 5100 : 17). Ключ: множення на одноцифрове – 1-ша картка; круглі на круглі – 2-га; ділення на одноцифрове через розрядні одиниці – 3-тя; ділення на кругле число – 4-та. Уточніть в учителя.' })], { hard: true });

K12(20, 3, 'math', 'Рівняння', 'Країна футбольних м’ячів', '<b>Підкресли</b> розв’язок рівняння, що є числом, яке містить одиниці лише одного класу, і <b>дізнайся</b> назву країни, у якій у 2022 році виготовили найбільшу у світі кількість футбольних м’ячів, та значення цієї кількості. <b>Визнач</b> виробіток футбольних м’ячів у 2022 році у світі, якщо у країні з найбільшим виробітком він становить 8/10 від світового.', [
  F('Розв’яжи рівняння.', [{ l: '693 087 + x · 400 = 1 253 087 → x = (Україна)', a: 1400 }, { l: '800 045 − a · 240 = 728 045 → a = (Туреччина)', a: 300 }, { l: 'b : 8000 − 3065 = 1935 → b = (Пакистан)', a: 40000000 }, { l: '7800 · (6830 − k) = 312 000 → k = (Велика Британія)', a: 6790 }],
    { hints: ['Невідомий доданок: від суми відніми відомий доданок. Потім невідомий множник: добуток поділи на відомий множник.', 'b : 8000 − 3065 = 1935 → b : 8000 = 5000 → b = 40 000 000.', '6830 − k = 312 000 : 7800 = 40 → k = 6790.'] }),
  C('У якій країні виготовили найбільше м’ячів у 2022 році?', ['Пакистан – 40 000 000', 'Туреччина – 300', 'Україна – 1400', 'Велика Британія – 6790'], 0,
    { why: [null, '300 м’ячів – це замало для цілої країни. Шукай число, у якого ненульові цифри лише в одному класі й воно дуже велике.', 'У числі 1 400 є одиниці двох класів: тисяч і одиниць.', 'У числі 6790 є одиниці двох класів.'] }),
  N('Світовий виробіток (8/10 від нього – 40 000 000)', 50000000, ['40 000 000 – це 8 частин із 10. Одна частина: 40 000 000 : 8 = 5 000 000.', 'Усі 10 частин: 5 000 000 · 10.'])],
  { hard: true, verify: 'Одиниці лише одного класу формально має і 300 (Туреччина), і 40 000 000 (Пакистан). За змістом (рекордна кількість, частка 8/10) ключ – Пакистан, 40 000 000.' });

/* ---------- с. 21 ---------- */
K12(21, 4, 'math', 'Величини', 'Історія футболу в числах', '<b>Прочитай</b> текст і <b>доповни</b> його. <b>Підкресли</b> кількісні (однією лінією), порядкові (двома лініями) іменовані числа олівцями кольорів шрифту назв величин, які вони позначають.<br><i>Перший у світі гумовий м’яч з’явився в 1855 році. Перші офіційні правила футболу були ухвалені 8 грудня 1863 року в Англії. Перше футбольне поле України збудували в Одесі у 1884 році. Офіційно перший матч із футболу в Україні відбувся 14 липня 1894 року між командами Львова і Кракова. Отже, історія футболу в Україні розпочалася в … столітті. … 24 серпня 2001 року в Харкові відкрили пам’ятник футбольному м’ячу. Діаметр гранітного м’яча 1 м 5 дм, маса – понад 2 тонни.</i>', [
  F('У якому столітті розпочалася історія футболу в Україні? (римськими цифрами)', [{ l: 'століття', a: 'XIX', norm: 'roman' }], { hints: CENT_H }),
  CL('Яку величину позначає іменоване число?', ['час', 'довжина', 'маса'], ['1855 році', '8 грудня 1863 року', '14 липня 1894 року', '24 серпня 2001 року', '1 м 5 дм', '2 тонни'], [0, 0, 0, 0, 1, 2]),
  CL('Кількісне чи порядкове число?', ['кількісне (одна лінія)', 'порядкове (дві лінії)'], ['1855 році', '8 грудня', '1 м 5 дм', '2 тонни', '14 липня'], [1, 1, 0, 0, 1],
    { hints: ['Порядкове відповідає на питання «котрий?»: у котрому році? котрого числа?', 'Кількісне – «скільки?»: скільки метрів, скільки тонн.'] }),
  N('Скільки років минуло від першого офіційного матчу в Україні (1894) до відкриття пам’ятника м’ячу (2001)?', 107, ['2001 − 1894'], { bonus: true })]);

K12(21, 5, 'math', 'Величини', 'Мілі- і кіло-', '<b>Запиши</b> назви одиниць вимірювання в ментальній карті. <b>Запиши</b> числа, щоб рівності стали істинними.', [
  F('Назви одиниць у ментальній карті.', [{ l: 'мілі + грам (зменшую в 1000 разів)', a: ['міліграм'], norm: 'word', w: 12 }, { l: 'мілі + метр', a: ['міліметр'], norm: 'word', w: 12 }, { l: 'кіло + грам (збільшую в 1000 разів)', a: ['кілограм'], norm: 'word', w: 12 }, { l: 'кіло + метр', a: ['кілометр'], norm: 'word', w: 12 }]),
  F('Зроби рівності істинними.', [{ l: '1 км = … м', a: 1000 }, { l: '1 кг = … г', a: 1000 }, { l: '1 м = … мм', a: 1000 }, { l: '1 г = … мг', a: 1000 }, { l: '45 км 300 м = … м', a: 45300 }, { l: '420 г 25 мг = … мг', a: 420025 }],
    { hints: ['Кіло- = 1000. Мілі- = одна тисячна.', '420 г = 420 000 мг; додай 25 мг. Обережно з нулями!'] })]);

K12(21, 6, 'math', 'Величини', 'Характеристика футбольних м’ячів', '<b>Підкресли</b> складене іменоване число й <b>запиши</b> його у формі простого.<br>Таблиця «Характеристика футбольних м’ячів»: форма – сфера; поверхня – 12 п’ятикутників, 20 шестикутників.<br>1) 136 мм, 250 г – реклама; 2) 178 мм, 283 г 500 мг – тренування; 3) 194 мм, 340 г – до 8 років; 4) 202 мм, 369 г – 425 г – 9–12 років; 5) 222 мм, 410 г – 450 г – гра / змагання.', [
  C('Яке число в таблиці складене іменоване?', ['283 г 500 мг', '250 г', '202 мм', '369 г – 425 г'], 0, { why: [null, 'Тут лише одна одиниця – грами.', 'Тут лише одна одиниця – міліметри.', 'Це два простих числа, межі.'] }),
  N('Запиши 283 г 500 мг у міліграмах.', 283500, ['1 г = 1000 мг. 283 г = 283 000 мг.'])]);

K12(21, 7, 'math', 'Задачі на величини', 'Сітка й коробка для м’ячів', '<b>Познач</b> задачу, яку можна розв’язати двома способами. <b>Розв’яжи</b> її. <b>Доповни</b> даними з таблиці в завданні № 6 іншу задачу. <b>Розв’яжи</b> її.<br>1) Маса 20 однакових футбольних м’ячів 6 кг 800 г. Чи витримає сітка манежу 40 таких самих м’ячів, якщо вона розрахована на зберігання спортивного інвентарю масою не більш як 15 кг?<br>2) Коробка для м’ячів має дно прямокутної форми площею 147 000 мм² і довжиною однієї сторони 700 мм. Скільки футбольних м’ячів для дітей 9–12 років можна покласти в цю коробку в 1 ряд?', [
  C('Яку задачу можна розв’язати двома способами?', ['першу (про сітку)', 'другу (про коробку)'], 0, { hints: ['40 м’ячів – це вдвічі більше, ніж 20. А можна спершу знайти масу одного м’яча.'] }),
  F('Задача 1.', [{ l: 'Маса 40 м’ячів, г', a: 13600 }, { l: 'Маса одного м’яча, г', a: 340 }, { l: 'Чи витримає сітка? (так / ні)', a: ['так'], norm: 'word', w: 6 }],
    { hints: ['1-й спосіб: 6 кг 800 г · 2. 2-й спосіб: 6800 г : 20 · 40.', '13 кг 600 г менше за 15 кг.'] }),
  F('Задача 2.', [{ l: 'Ширина дна коробки, мм', a: 210 }, { l: 'Діаметр м’яча для 9–12 років (з таблиці), мм', a: 202 }, { l: 'Скільки м’ячів уміститься в 1 ряд?', a: 3 }],
    { hints: ['Невідома сторона = площа : відома сторона.', 'Уздовж 700 мм: 700 : 202 = 3 (ост. 94). Ширина 210 мм – уміщається лише один ряд.'] })],
  { hard: true, verify: 'Ключ задачі 2 ураховує лише цілі м’ячі в один ряд уздовж довгої сторони: 3 м’ячі.' });

K12(22, 1, 'math', 'Множення й ділення круглих чисел', 'Розвага до сьомого поту', '<b>Доповни</b> твердження і <b>підкресли</b> зайвий вираз. <b>Запиши</b> слово за порядком зростання значень виразів. <b>Побудуй</b> із ним і словами з довідки (спорт, сьомий, це, піт, до) речення. <b>Підтвердь</b> або <b>спростуй</b> думку.', [
  F('Доповни правила.', [
    { l: 'Для ділення круглого числа на кругле в діленому і дільнику закриваю стільки нулів, скільки їх у …', a: ['дільнику'], norm: 'word', w: 12 },
    { l: 'Якщо множу кругле число на кругле, у добутку записую стільки нулів, скільки їх …', a: ['в обох множниках', 'у обох множниках', 'в обох множниках разом', 'у множниках', 'в множниках', 'в обох множниках разом узятих'], norm: 'word', w: 18 }]),
  F('Обчисли.', [{ l: '960 000 : 80 (в)', a: 12000 }, { l: '400 · 120 (а)', a: 48000 }, { l: '340 000 : 170 (о)', a: 2000 }, { l: '27 000 · 30 (а)', a: 810000 }, { l: '98 000 : 14 (з)', a: 7000 }, { l: '300 · 340 (г)', a: 102000 }, { l: '648 000 : 800 (р)', a: 810 }],
    { grid: true, hints: ['340 000 : 170 = 34 000 : 17 = 2000.', '648 000 : 800 = 6480 : 8 = 810.'] }),
  T('Слово за порядком зростання значень', ['розвага'], { hints: ['Найменше значення – 810 (р).'] }),
  C('Який вираз зайвий?', ['98 000 : 14', '960 000 : 80', '300 · 340', '27 000 · 30'], 0, { why: [null, 'Тут обидва числа круглі.', 'Тут обидва числа круглі.', 'Тут обидва числа круглі.'], hints: ['Чи всі дільники й множники – круглі числа?'] }),
  T('Склади речення зі словом і словами з довідки.', ['спорт це розвага до сьомого поту', 'спорт – це розвага до сьомого поту'], { wide: true }),
  O('Підтверди або спростуй цю думку 1–2 реченнями.', { min: 25 })],
  { verify: 'Слово «розвага» складається з усіх семи виразів, зокрема й 98 000 : 14. «Зайвим» за правилом про круглі числа визнано 98 000 : 14 (14 – не кругле). Уточніть в учителя.' });

K12(22, 2, 'math', 'Порядок дій', 'Флорбол, петанк, черлідинг', '<b>Підкресли</b> рівні за значенням вирази й <b>дізнайся</b>, якими видами спорту займаються діти.', [
  F('Обчисли вирази дітей.', [{ l: 'Дівчинка з бантом: 7600 · 40 − 236 000', a: 68000 }, { l: 'Дівчинка: 300 · 240 : 60', a: 1200 }, { l: 'Хлопчик: 700 · 1200 : 140', a: 6000 }]),
  F('Обчисли вирази видів спорту.', [{ l: 'флорбол: (34 378 + 73 622) : 18', a: 6000 }, { l: 'петанк: (563 403 − 455 403) : 90', a: 1200 }, { l: 'черлідинг: 17 000 · (384 : 96)', a: 68000 }]),
  MT('Хто яким спортом займається?', ['дівчинка з бантом', 'дівчинка', 'хлопчик'], ['черлідинг', 'петанк', 'флорбол'])]);

K12(22, 3, 'math', 'Задачі на величини', 'Кальцій для чемпіона', '<b>Познач</b> продукти, які ти б дода(в/ла) до свого меню для дотримання денної норми споживання кальцію. <b>Доповни</b> судження.<br>Кальцій: молоко 100 мл – 125 мг; сир 20 г – 120 мг; кисломолочний сир 50 г – 145 мг; йогурт 175 мл – 275 мг; мигдаль 100 г – 260 мг; капуста 100 г – 150 мг. Денна норма – 1300 мг.', [
  N('Якщо протягом дня я випиватиму 200 мл молока, то протягом тижня мій організм отримає … мг кальцію.', 1750, ['200 мл – це 2 рази по 100 мл: 125 · 2 = 250 мг на день.', 'За тиждень (7 днів): 250 · 7.']),
  M('Які продукти ти б додав(ла) до меню?', ['молоко', 'сир', 'кисломолочний сир', 'йогурт', 'мигдаль', 'капуста'], 'any', { inline: true }),
  F('Склади своє меню на день і порахуй кальцій.', [{ l: 'Скільки мг кальцію в 200 мл молока?', a: 250 }, { l: 'Скільки мг кальцію в 40 г сиру?', a: 240 }, { l: 'Скільки ще бракує до 1300 мг після молока й сиру?', a: 810 }],
    { hints: ['40 г – це 2 · 20 г.', '1300 − 250 − 240.'] }),
  S('Заповни в зошиті стовпчик «Маса продукту на добу для мене».', { label: 'Заповнив(ла)' })]);

K12(23, 4, 'math', 'Величини', 'Рекорд п’ятирічного ролера', '<b>Запиши</b> іменовані числа у рівності. <b>Познач</b> зайве число й <b>дізнайся</b> про рекорд п’ятирічного ролера Олега Рухліна в спід-слаломі. <b>Доповни</b> текст.', [
  F('Запиши рівності.', [{ l: '5 г = … мг', a: 5000 }, { l: '6 т = … кг', a: 6000 }, { l: '25 г 370 мг = … мг', a: 25370 }, { l: '370 г 048 мг = … мг', a: 370048 }, { l: '25 ц = … кг', a: 2500 }, { l: '3 кг 045 г = … г', a: 3045 }, { l: '3/20 хв = … с', a: 9 }, { l: '38 ц 75 кг = … кг', a: 3875 }],
    { grid: true, hints: ['1 ц = 100 кг, 1 т = 1000 кг.', '1 хв = 60 с. 3/20 хвилини: 60 : 20 · 3.'] }),
  C('Яке число зайве?', ['9 с', '5000 мг', '3875 кг', '6000 кг'], 0, { why: [null, 'Це маса, як і більшість чисел.', 'Це маса, як і більшість чисел.', 'Це маса, як і більшість чисел.'], hints: ['Усі числа, крім одного, позначають масу.'] }),
  F('Доповни текст: доріжка – крива лінія між 20 конусами, відстань між сусідніми конусами 80 см.', [{ l: 'Відстань між першим і останнім конусом, см', a: 1520 }, { l: 'Шлях руху спортсмена буде … (більшим / меншим) за це значення', a: ['більшим', 'довшим'], norm: 'word', w: 10 }],
    { hints: ['Між 20 конусами – 19 проміжків, а не 20!', '19 · 80. Спортсмен їде звивисто – тож шлях довший за пряму.'] })],
  { verify: 'Значення рекорду в зошиті прямо не названо; за умовою зайве число (час) – 9 с. Перевірте з учителем, як саме сформульовано рекорд.' });

K12(23, 5, 'math', 'Величини', 'Класифікуй рівності', '<b>Обчисли</b> вирази. <b>Обери</b> ознаку, <b>підкресли</b> її назву й <b>класифікуй</b> рівності: <b>обведи</b> рівності однієї групи олівцем одного кольору.<br>Ознаки: за величиною, за отриманим числом, за арифметичною дією.', [
  F('Обчисли.', [{ l: '400 г · 35 = … г', a: 14000 }, { l: '300 мл · 12 = … мл', a: 3600 }, { l: '240 000 кг : 60 кг', a: 4000 }, { l: '24 см · 600 = … см', a: 14400 }, { l: '1480 м : 4 м', a: 370 }, { l: '84 000 мг : 70 мг', a: 1200 }, { l: '9240 км : 6 = … км', a: 1540 }, { l: '6700 л · 12 = … л', a: 80400 }], { grid: true }),
  CL('Класифікуй за отриманим числом.', ['іменоване число (з одиницями)', 'неіменоване число'], ['400 г · 35', '300 мл · 12', '240 000 кг : 60 кг', '24 см · 600', '1480 м : 4 м', '84 000 мг : 70 мг', '9240 км : 6', '6700 л · 12'], [0, 0, 1, 0, 1, 1, 0, 0],
    { hints: ['Якщо ділимо кілограми на кілограми, отримуємо «у скільки разів» – просто число.'] })],
  { verify: 'Ознаку класифікації дитина обирає сама; тут перевіряється класифікація «за отриманим числом».' });

K12(23, 6, 'math', 'Задачі на трійки величин', 'Черлідинг і флорбол', '<b>Познач</b> задачі, що містять взаємозв’язок між трійками величин. <b>Підкресли</b> позначення відповідних трійок для кожної задачі. <b>Розв’яжи</b> ці задачі.<br>Q = W · t; s = v · t; M = m · n; В = Ц · К<br>1) Для пошиття костюмів черлідинговій команді купили 60 м трикотажу вартістю 5400 грн і 40 м атласу, ціна якого у 2 рази менша. На скільки гривень менше заплатили за атлас, ніж за трикотаж?<br>2) Для помпонів купили поліетилен ціною 20 грн: 300 м синього, зеленого – у 2 рази менше, ніж синього, а жовтого – на 250 м більше, ніж зеленого. Скільки гривень заплатили за весь поліетилен?<br>3) На матч із флорболу продали квитки на 70 000 грн. З них 3/10 перерахували безготівково, 4/7 решти внесли через платіжний термінал, а решту – готівкою. Скільки гривень каса отримала готівкою?', [
  M('Які задачі містять взаємозв’язок між трійкою величин?', ['задача 1', 'задача 2', 'задача 3'], [0, 1], { hints: ['Ціна, кількість, вартість – це трійка В = Ц · К. Де вона є?'] }),
  F('Задача 1 (В = Ц · К).', [{ l: 'Ціна трикотажу, грн за 1 м', a: 90 }, { l: 'Ціна атласу, грн', a: 45 }, { l: 'Вартість атласу, грн', a: 1800 }, { l: 'На скільки менше заплатили за атлас, грн', a: 3600 }]),
  F('Задача 2 (В = Ц · К).', [{ l: 'Зеленого, м', a: 150 }, { l: 'Жовтого, м', a: 400 }, { l: 'Усього, м', a: 850 }, { l: 'Заплатили, грн', a: 17000 }]),

K12(24, 1, 'math', 'Нумерація багатоцифрових чисел', 'Гопак', '<b>Підкресли</b> в кожному числі загальну кількість десятків тисяч і загальну кількість сотень. <b>Побудуй</b> слово за порядком зростання чисел. <b>Запиши</b> його в те твердження, з яким ти погоджуєшся.<br>560 708 (п), 65 078 (г), 937 200 (а), 3 093 020 (к), 393 020 (о).', [

K12(24, 2, 'math', 'Усні й письмові обчислення', 'Усно чи письмово', '<b>Перевір</b> підкреслення лаксиками виразів відповідно до обраних ними способів обчислення. <b>Обчисли</b> вирази. <b>Поясни</b> способи обчислення.<br>Зразок усно: 214 · 3 = (200 + 10 + 4) · 3 = 642; 436 : 4 = (400 + 36) : 4 = 109. Письмово: 237 · 4 = 948; 5368 : 8 = 671 (у зошиті – стовпчиком).', [

K12(24, 4, 'math', 'Усні й письмові обчислення', 'Раціональні записи', '<b>Познач</b> раціональні записи обчислення виразів. <b>Обведи</b> позначення цих виразів і буквені рівності, що ілюструють спосіб їх обчислення, олівцями одного кольору. <b>Обчисли</b> вирази письмово.<br>(a · 100) · b = (a · b) · 100; (k · 100) : n = (k : n) · 100; (d + c) : m = d : m + c : m', [

K12(25, 6, 'math', 'Задачі на трійки величин', 'Дзиґа бойового гопака', '<b>Познач</b> назву величини, за якою визначали рівень майстерності Петрика. <b>Розв’яжи</b> задачу.<br>На тренуваннях у секції бойового гопака під час виконання вправи «Дзиґа» у квітні Петрик за 3 хв робив 27 обертів, щохвилини однакову кількість, а в жовтні за 3 хв – 42 оберти. Якого рівня майстерності досягнув хлопчик, якщо «соколи» мають виконувати не менш як 9 обертів за хвилину, а «яструби» – не менш як 12 обертів за хвилину?', [
  C('За якою величиною визначали майстерність?', ['продуктивність', 'швидкість', 'час', 'обсяг роботи'], 0, { why: [null, 'Швидкість – це відстань за одиницю часу. А тут – кількість обертів (робота) за хвилину.', 'Час однаковий – 3 хв.', 'Обсяг роботи – це всі оберти, а рівень визначають «за хвилину».'] }),
  F('Розв’яжи.', [{ l: 'Обертів за 1 хв у квітні', a: 9 }, { l: 'Обертів за 1 хв у жовтні', a: 14 }, { l: 'Рівень у жовтні («сокіл» / «яструб»)', a: ['яструб', 'яструби'], norm: 'word', w: 10 }])]);

K12(25, 7, 'math', 'Частини числа', 'Гопак і кунг-фу', '<b>Розв’яжи</b> задачу. <b>Склади</b> й <b>розв’яжи</b> подібні задачі, збільшивши кількість груп учнів, які займаються китайським кунг-фу. <b>Поясни</b> залежність розв’язку задачі від зміни даних.<br>У спортивній школі займалися бойовим гопаком 256 учнів у 8 групах, порівну в кожній, а китайським кунг-фу займалися 7 груп, кількість учнів у кожній становила 5/8 від кількості учнів в одній групі з бойового гопака. На скільки учнів більше займалося бойовим гопаком, ніж китайським кунг-фу?', [

K12(27, 4, 'math', 'Задачі на частини', 'Аквацентри', '<b>Пронумеруй</b> запитання для плану розв’язування задачі. <b>Закресли</b> зайві запитання. <b>Розв’яжи</b> задачу.<br>Для будівництва 4 аквацентрів у різних містах держава виділила з бюджету 24 млн грн, порівну на кожен аквацентр, що становить 5/8 потрібної суми. Місцева влада може виділити з бюджету третину грошей, яких не вистачає, а решту коштів надають меценати. Скільки коштів нададуть меценати для будівництва 1 аквацентру в місті?', [

K12(27, 5, 'math', 'Задачі на трійки величин', 'Синхронне плавання', '<b>Склади</b> задачу за моделлю і запитанням. <b>Розв’яжи</b> задачу. <b>Склади</b> обернену задачу на визначення обсягу роботи однієї спортсменки.<br>Ірина: t = 3 хв, Q = 18 фігур. Оксана: t = 4 хв, Q = 16 фігур. На скільки фігур має збільшити продуктивність роботи Оксана, щоб виконувати їх синхронно з Іриною?', [

K12(27, 7, 'math', 'Геометрія', 'Квадрат і круг', '<b>Побудуй</b> прямокутник ABCD, периметр якого 240 мм, а довжина однієї зі сторін 50 мм, і відрізок KN, що перетинає прямокутник так, щоб утворити квадрат і менший прямокутник. <b>Побудуй</b> круг діаметром 40 мм так, щоб його центром була середина відрізка KN. <b>Розфарбуй</b> перетин круга і квадрата.', [

K12(28, 2, 'math', 'Усні й письмові обчислення', 'Марафонська дистанція', '<b>Перевір</b> результати обчислень. <b>Виправ</b> помилки. <b>Познач</b> вираз із помилкою і пораду щодо її уникнення олівцем одного кольору. <b>Підкресли</b> число, що є правильним результатом обчислення, і <b>дізнайся</b>, яку дистанцію (у метрах) долають спортсмени під час марафону. <b>Запиши</b> це число в більших одиницях вимірювання. <b>Обчисли</b> решту виразів.<br>У зошиті записано: 8094 · 7 = 57 358; 27 040 · 5 = 135 040; 14 065 · 3 = 42 195; 1 128 003 : 3 = 376…; 438 246 : 6 = 736…', [

K12(28, 3, 'math', 'Ділення на розрядну одиницю', 'Юлія Левченко', '<b>Обчисли</b> вирази. <b>Підкресли</b> зайвий вираз і <b>дізнайся</b>, у якому виді спорту прославила Україну спортсменка Юлія Левченко. <b>Поясни</b> послідовність обчислення зайвого виразу.', [

K12(29, 4, 'math', 'Ділення з остачею', 'За чим визначають переможців', '<b>Підкресли</b> у діленому кожного виразу цифри, що в результаті обчислення позначатимуть остачу. <b>Підкресли</b> однаково вирази з однаковою остачею без обчислення й <b>дізнайся</b>, за показниками яких величин визначають переможців у зображених на світлинах видах спорту.<br>Світлини: стрибки у висоту – 7 145 238 : 100; метання списа – 40 128 : 100; метання диска – 360 128 : 1000; біг – 520 634 : 10 000.<br>Картки: 73 428 : 100 – відстань; 809 634 : 1000 – час; 75 128 : 1000 – продуктивність; 1 083 038 : 1000 – висота.', [

  MT('З’єднай вид спорту з величиною (за однаковою остачею).', ['стрибки у висоту', 'метання списа', 'біг'], ['висота', 'відстань', 'час']),

K12(29, 6, 'math', 'Задачі на трійки величин', 'Влада, лижник і Руслан', '<b>Розфарбуй</b> дані задачі, яка не містить взаємозв’язку між трійкою величин. <b>Познач</b> інші задачі й буквені позначення трійок взаємопов’язаних величин, про які йдеться в цих задачах, однаково. <b>Розв’яжи</b> задачі.<br>1) Під час тренування зі спортивного бігу Влада, рівномірно рухаючись, подолала відстань 3000 м за 12 хв. Потім вона вповільнила рух на 100 м/хв і пройшла ще чверть подоланої відстані. На скільки хвилин більше Влада бігла, ніж ішла?<br>2) Лижник пройшов гірською дорогою 8000 м, що становило 2/5 рівнинної дороги. Далі лижник пройшов через ліс відстань, у 7 разів меншу, ніж весь попередньо пройдений шлях. Скільки всього метрів подолав лижник?<br>3) Руслан за 6 хв віджався 180 разів, рухаючись ритмічно. Після тижня тренувань він за цей самий час зміг віджатися 192 рази. На скільки більше віджимань за хвилину став виконувати Руслан, ніж тиждень тому?', [
  MT('Яка трійка величин у кожній задачі?', ['задача 1 (Влада)', 'задача 2 (лижник)', 'задача 3 (Руслан)'], ['v, t, s', 'немає трійки – частини числа', 'W, t, Q']),
  F('Задача 1.', [{ l: 'Швидкість бігу, м/хв', a: 250 }, { l: 'Швидкість ходьби, м/хв', a: 150 }, { l: 'Пройшла пішки, м', a: 750 }, { l: 'Ішла, хв', a: 5 }, { l: 'На скільки хвилин довше бігла', a: 7 }]),
  F('Задача 2.', [{ l: 'Рівнинна дорога, м', a: 20000 }, { l: 'Через ліс, м', a: 4000 }, { l: 'Усього, м', a: 32000 }], { hints: ['8000 – це 2 частини з 5. Одна частина – 4000 м.', 'Попередній шлях: 8000 + 20 000 = 28 000 м. У 7 разів менше – 4000 м.'] }),
  F('Задача 3.', [{ l: 'Віджимань за 1 хв тиждень тому', a: 30 }, { l: 'Віджимань за 1 хв тепер', a: 32 }, { l: 'На скільки більше', a: 2 }])], { hard: true });

    { l: 'П’ятий океан (познач сам(а))', a: ['північний льодовитий', 'північний льодовитий океан'], norm: 'word', w: 18 }],

K12(32, 1, 'vs', 'Атлантичний океан', 'Океан Атланта', '<b>Прочитай</b> текст. <b>Запиши</b> в реченнях і на контурній карті назву океану, про який розповідається в тексті. <b>Розфарбуй</b> зображення материків, що їх омивають води цього океану.<br><i>Назву океану, за однією з версій, дали мореплавці з Греції на честь велетня Атланта, який тримав на своїх руках небосхил. … океан – другий за величиною та глибиною на Землі. Він розташований у Західній і Східній півкулях. Східною межею … океану є береги Євразії та Африки, західною – Північної і Південної Америки. На сході він межує з Індійським океаном, на заході – з Тихим, на півночі – з Північним Льодовитим, на півдні – з Південним океаном. В … океані розташовані Балтійське, Північне, Середземне, Карибське, Саргасове моря. У цей океан впадають річки Амазонка, Міссісіпі, Нігер, Конго. У цьому океані проходить потужна тепловодна течія Гольфстрим. Вона приносить тепло в Північну півкулю Землі. … океан розташований в усіх теплових поясах Землі. Тому температура води в різних частинах океану – різна. Найтепліша – поблизу екватора. У помірних поясах багато айсбергів і плавучої криги.</i>', [
  T('Назва океану', ['атлантичний', 'атлантичний океан'], { hints: ['Велетень Атлант.'] }),
  M('Які материки омиває цей океан?', ['Євразія', 'Африка', 'Північна Америка', 'Південна Америка', 'Австралія', 'Антарктида'], [0, 1, 2, 3, 5], { inline: true,
    hints: ['У тексті названо береги чотирьох материків. На півдні океан межує з Південним океаном біля Антарктиди.'] }),
  F('Знайди в тексті.', [{ l: 'Тепла течія, що приносить тепло в Північну півкулю', a: ['гольфстрим'], norm: 'word', w: 12 }, { l: 'Котрий за величиною цей океан?', a: ['другий', '2'], norm: 'word', w: 8 }]),
  M('Які моря розташовані в цьому океані?', ['Балтійське', 'Чорне', 'Середземне', 'Карибське', 'Саргасове', 'Червоне', 'Північне'], [0, 2, 3, 4, 6], { inline: true }),
  M('Які річки впадають у цей океан?', ['Амазонка', 'Ніл', 'Міссісіпі', 'Дніпро', 'Нігер', 'Конго'], [0, 2, 4, 5], { inline: true })],
  { verify: 'Чи омиває Атлантичний океан Антарктиду, залежить від того, чи виділяють Південний океан. За текстом зошита на півдні Атлантичний межує з Південним океаном – Антарктиду зараховано як варіант для обговорення.' });

K12(32, 2, 'vs', 'Атлантичний океан', 'Водорості Атлантики', '<b>Прочитай</b> текст. <b>Пронумеруй</b> зображення водоростей.<br><i>Рослинний світ Атлантичного океану не дуже різноманітний. Різноманітніший він у помірних теплових поясах, біля узбережжя материків і в поверхневих водах. Так, на дні поблизу берегів ростуть червоні (1) водорості та ламінарії, які ще називають морською капустою (2). Багато тут і велетенських бурих водоростей – саргасових (3). Найбільше їх у морі, яке так і називають – Саргасовим.</i>', [
  F('Номери для світлин у зошиті (зліва направо).', [{ l: 'ліва (жовто-бура, гіляста)', a: 3 }, { l: 'середня (зелені широкі листки)', a: 2 }, { l: 'права (червона)', a: 1 }],
    { hints: ['Морська капуста – ламінарія – має широкі листки.'] }),
  F('Із тексту.', [{ l: 'Як ще називають ламінарії?', a: ['морська капуста', 'морською капустою'], norm: 'word', w: 14 }, { l: 'Яке море назване на честь водоростей?', a: ['саргасове', 'саргасове море'], norm: 'word', w: 14 }])],
  { verify: 'Кольори в скані: ліва світлина – жовто-бура (саргасові), середня – зелена (ламінарія), права – червона. Звірте з паперовим зошитом.' });

K12(33, 3, 'vs', 'Атлантичний океан', 'Тваринний світ Атлантики', '<b>Прочитай</b> текст й <b>обведи</b> зайву світлину. <b>Підкресли</b> назви звірів.<br><i>Тваринний світ Атлантичного океану – різноманітний. Найбільш поширеними є риби, серед яких тріска, оселедець, скумбрія, окунь морський. Є багато сардин, тунців. Біля екватора водяться летючі риби, хижі баракуди й акули. У теплих водах цього океану живуть корали. У північних водах океану мешкають кити й тюлені. Також в Атлантичному океані живуть кальмари, креветки, лангусти, дельфіни, кашалоти. У водах холодного поясу океану серед риб переважають нототенії. Мешканцями цього океану в жаркому поясі є медузи, краби, летючі риби, морські черепахи, кальмари, восьминоги. Морських птахів небагато. Переважно це альбатроси й фрегати.</i><br>Світлини в зошиті: кальмар, летюча риба, щука, креветка, тюлень.', [
  C('Яка світлина зайва?', ['щука', 'кальмар', 'летюча риба', 'креветка', 'тюлень'], 0, { why: [null, 'Кальмари в тексті є.', 'Летючі риби в тексті є.', 'Креветки в тексті є.', 'Тюлені в тексті є.'], hints: ['Цієї тварини немає в тексті – вона живе в прісних річках і озерах.'] }),
  M('Які з цих тварин – звірі (ссавці)?', ['кити', 'тюлені', 'дельфіни', 'кашалоти', 'акули', 'тріска', 'восьминоги', 'альбатроси'], [0, 1, 2, 3],
    { inline: true, hints: ['Звірі вигодовують малят молоком і дихають повітрям, навіть якщо живуть у воді.', 'Акула – риба, а альбатрос – птах.'] })]);

K12(33, 4, 'vs', 'Атлантичний океан', 'Корисні копалини', '<b>Прочитай</b> текст. <b>Запиши</b> назви корисних копалин за їхніми умовними позначеннями. <b>Розкажи</b> про корисні копалини Атлантичного океану.<br><i>Атлантичний океан багатий родовищами корисних копалин. З води добувають □ (кубик) … . За допомогою бурових платформ в Атлантичному океані добувають ▲ (чорний знак) … і △ (світлий знак) … . У прибережних водах Канади, Великої Британії видобувають ■ (чорний квадрат) …, а біля південно-західних берегів Африки – алмази.</i>', [
  F('Запиши назви корисних копалин.', [
    { l: '□ кубик (з води)', a: ['кухонну сіль', 'кухонна сіль', 'сіль', 'кам\'яна сіль', 'кам\'яну сіль'], norm: 'word', w: 14 },

    { l: '■ чорний квадрат (Канада, Велика Британія)', a: ['кам\'яне вугілля', 'вугілля'], norm: 'word', w: 14 }],
    { hints: ['Згадай умовні позначення корисних копалин на карті: чорний трикутник – нафта, порожній – газ, чорний квадрат – вугілля.', 'Що лишається, коли випаровується морська вода?'] }),

K12(33, 5, 'vs', 'Атлантичний океан', 'Людина й океан', '<b>Прочитай</b> текст про те, як люди використовують Атлантичний океан (у зошиті). <b>Постав</b> запитання за змістом тексту сусід(у/ці) по парті. <b>Відповідай</b> на його / її запитання.', [
  F('Знайди в тексті.', [{ l: 'Скільки країн розташовано на берегах океану?', a: 70 }, { l: 'Що роблять установки в посушливих прибережних районах?', a: ['опріснюють воду', 'опріснюють'], norm: 'word', w: 14 }]),
  M('Що з цього спричиняє забруднення й загибель тварин океану (за текстом)?', ['нафтові плями', 'надмірний вилов', 'електростанції на енергії хвиль', 'курорти на березі'], [0, 1]),

K12(34, 1, 'vs', 'Атлантичний океан', 'Материки Атлантики', '<b>Обведи</b> назви материків, береги яких омивають води Атлантичного океану. <b>Розфарбуй</b> їх на контурній карті світу з індивідуального боксу.', [

K12(34, 2, 'vs', 'Атлантичний океан', 'Сусіди Атлантики', '<b>Підкресли</b> назви океанів, які межують з Атлантичним океаном. <b>Запиши</b> їхні назви на контурній карті з індивідуального боксу.', [

K12(34, 3, 'vs', 'Атлантичний океан', 'Цікаві факти про Атлантику', '<b>Запиши</b> пропущені слова. <b>Користуйся</b> (за потреби) текстами на с. 32. <b>Підкресли</b> речення, яким можна підписати зображення (портрет мореплавця і кораблі).<br><i>Назва океану, за однією з версій, походить від назви континенту Атлантида. В Атлантичному океані міститься чверть усієї води світу. Найглибша точка становить понад 8700 метрів. Води цього океану солоніші, ніж води будь-якого іншого. Мореплавець Христофор Колумб – перший європеєць, який перетнув Атлантичний океан. … Найвищі у світі припливи – у канадській затоці Фанді, іноді до 18 метрів.</i>', [
  F('Запиши пропущені слова.', [
    { l: 'В акваторії Атлантичного океану розташоване єдине у світі море, яке не має берегів. Воно називається, як і бурі водорості, – … море.', a: ['саргасове'], norm: 'word', w: 14 },
    { l: 'У цьому океані проходить найдовша у світі течія – …', a: ['гольфстрим'], norm: 'word', w: 14 }],
    { hints: ['Згадай текст про водорості на с. 32.', 'Тепла течія з тексту на с. 32.'] }),
  C('Яким реченням можна підписати зображення?', ['Мореплавець Христофор Колумб – перший європеєць, який перетнув Атлантичний океан.', 'Найглибша точка Атлантичного океану становить понад 8700 метрів.', 'Води цього океану солоніші, ніж води будь-якого іншого.'], 0)],
  { verify: 'Два твердження зошита варто обговорити з дитиною. 1) Колумба тут названо першим європейцем, що перетнув Атлантику. Але вікінги (Лейф Ерікссон) досягли Північної Америки приблизно за 500 років до нього. Колумб був першим, чиї подорожі започаткували постійні зв’язки. 2) Гольфстрим – одна з найпотужніших течій, проте найдовшою зазвичай називають Антарктичну циркумполярну течію. Ключ «Гольфстрим» прийнято за логікою зошита.' });

K12(34, 4, 'vs', 'Критичне мислення', 'Бермудський трикутник', '<b>Підкресли</b> речення з правдивою, на твою думку, інформацією.<br><i>В Атлантичному океані розташований Бермудський трикутник – акваторія, обмежена трикутником, вершинами якого є Флорида, Бермудські острови й Пуерто-Рико. За легендою, саме тут був розташований зниклий материк Атлантида, перед загибеллю якого його жителі створили сховище знань. Офіційного підтвердження легенда не має, але 1992 року американські вчені виявили в самому центрі Бермудського трикутника велику піраміду. Її розміри в три рази перевершують розміри піраміди Хеопса, а матеріал дуже нагадує скло.</i>', [
  CL('Правда, легенда чи вигадка?', ['✅ перевірений факт', '📜 легенда', '❌ неперевірена чутка'],
    ['Бермудський трикутник розташований в Атлантичному океані.', 'Вершини трикутника – Флорида, Бермудські острови й Пуерто-Рико.', 'Саме тут був розташований зниклий материк Атлантида.', 'Жителі Атлантиди створили сховище знань.', '1992 року вчені виявили в центрі трикутника скляну піраміду, утричі більшу за піраміду Хеопса.'],
    [0, 0, 1, 1, 2], { hints: ['Сам текст підказує: «за легендою», «офіційного підтвердження не має».', 'Якби вчені справді знайшли таку піраміду, про це писали б наукові журнали й підручники. Чи чув(ла) ти про неї?'] }),
  O('Як перевірити, чи правдива інформація з інтернету? Напиши 1–2 способи.', { min: 25 })],
  { verify: 'Розповідь про «скляну піраміду» 1992 року поширюється в інтернеті, але наукових підтверджень не має. Її віднесено до неперевірених чуток. Це навмисне завдання на критичне мислення («на твою думку»), тому відповіді дитини варто обговорити.' });

    const v = w.get(); if (v == null) { say('tip', 'Спочатку заповни всі поля цієї частини.'); return; }
    att++; const r = checkPart(p, v, w);
    if (r.ok) { say('good', att === 1 ? '🎉 Правильно з першої спроби!' : att >= 3 ? '💪 Вийшло! Ти не здався(лась) – це найцінніше.' : '👍 Тепер правильно!'); if (p.t === 'open') say('good', '📨 Збережено. Дорослий зможе прочитати твою відповідь.'); if (['self', 'draw'].includes(p.t)) fb.hidden = true; finish(v); return; }
    w.mark(r.bad || []); combo = 0; ctx.onWrong();
    if (p.t === 'open') { say('tip', esc(r.msg)); att--; return; }
    if (p.t === 'steps' && att >= 2) w.scaffold();
    const auto = att >= (ctx.support || 1) ? showHint() : '';
    say('bad', `<b>Ще не так, але це нормально.</b> ${esc(r.msg || GENERIC[p.t] || '')}${auto}<div class="again">Спробуй ще раз 🙂</div>`);
  };
  return box;
}
function keyOf(p) {
  const f = a => typeof a === 'function' ? '(залежить від даних дитини)' : Array.isArray(a) ? a.join(' / ') : typeof a === 'number' ? fmt(a) : a;
  switch (p.t) {
    case 'num': case 'steps': return fmt(p.a) + (p.scaffold ? ' (кроки: ' + p.scaffold.map(s => fmt(s.a)).join('; ') + ')' : '');
    case 'text': return p.check ? '(перевіряється програмою за умовою)' : p.norm === 'letters' ? p.a[0] + ' (без пробілів)' : p.a.join(' / ');
    case 'choice': return [].concat(p.a).map(i => p.o[i]).join('  АБО  ');
    case 'multi': return p.a === 'any' ? '(вільний вибір)' : p.a.map(i => p.o[i]).join('; ');
    case 'fields': return p.f.map(x => `${x.l}: ${f(x.a)}`).join('; ');
    case 'set': return p.a.map(g => g[0]).join(', ');
    case 'match': return p.l.map((l, i) => `${l} → ${p.r[i]}`).join(' | ');
    case 'order': return p.items.map((x, i) => `${i + 1}) ${x}`).join(' ');
    case 'classify': return p.items.map((x, i) => `${x} → ${[].concat(p.a[i]).map(k => p.cats[k]).join(p.multi ? ' + ' : ' або ')}`).join(' | ');
    case 'gaps': return p.words.map(w => w[0] + [].concat(w[1])[0].toUpperCase() + w[2]).join(', ');
    case 'cross': return p.words.map(w => `${w.n}. ${w.a}`).join(', ');
    case 'sol': return 'очікувані кроки: ' + p.steps.map(s => `${fmt(s.a)} – ${s.l}`).join('; ') + '. Приймається й коротший правильний шлях.';
    case 'cards': case 'listen': case 'spell': case 'build': case 'say': case 'read': return '(гра – зараховується, коли дитина пройде її до кінця)';
    case 'rule': return '(правило – прочитати)';
    default: return '(перевіряє дорослий)';
  }
}

/* ===== наказ штабу: обов'язкові завдання від дорослого ===== */
const fmtDate = d => d ? d.slice(8) + '.' + d.slice(5, 7) : '';
function missionDone(p) { const a = p && p.asg; if (!a) return true; return a.ids.every(id => !TASK[id] || taskState(p, id) === 'done') && a.custom.every(c => c.done); }
function activeMission(p) { return p && p.asg && !p.asg.fin && !missionDone(p) ? p.asg : null; }
function isMust(p, id) { const m = activeMission(p); return !!m && m.ids.includes(id); }
function lockedFor(h) { const m = activeMission(P()); if (!m) return false; if (h.startsWith('t-')) return !!TASK[h.slice(2)] && !m.ids.includes(h.slice(2)); return h.startsWith('r-') || h === 'trainer'; }
function lockTag(p, id) { const m = activeMission(p); return !m ? '' : m.ids.includes(id) ? '<span class="tagm">наказ</span>' : ' 🔒'; }
function checkOrder(p) {
  const a = p.asg; if (!a || a.fin || !missionDone(p)) return;
  a.fin = today(); if (!a.paid) { a.paid = 1; p.cr = (p.cr || 0) + 50; p.xp += 20; setTimeout(() => celebrate('Наказ штабу виконано!', '+50 кредитів і +20 XP. Решта зошита, Тренувальна зала й Реванш знову відкриті.'), 1500); }
}
function orderCard(p) {
  const a = p.asg; if (!a) return '';
  if (a.fin) return a.fin === today() ? '<div class="card ordok"><b>✓ Наказ штабу виконано</b><span>Решта зошита відкрита. Так тримати!</span></div>' : '';
  const ids = a.ids.filter(id => TASK[id]), total = ids.length + a.custom.length;
  const done = ids.filter(id => taskState(p, id) === 'done').length + a.custom.filter(c => c.done).length, nx = nextTask(p);
  const li = ids.map(id => { const t = TASK[id], dn = taskState(p, id) === 'done'; return `<li class="${dn ? 'dn' : ''}"><span class="ck">${dn ? '✓' : ''}</span><a href="#t-${id}">${bookTag(t)}${SUBJ[t.s].short} · с. ${dp(t.p)}, № ${t.n}<small>${esc(t.title)}</small></a>${dn ? '' : '<em>⬡ ×2</em>'}</li>`; })
    .concat(a.custom.map((c, i) => `<li class="${c.done ? 'dn' : ''}"><span class="ck">${c.done ? '✓' : ''}</span><span class="ot">${esc(CSUBJ[c.s] || '')} · ${esc(c.x)}<small>${c.done ? (c.ok ? 'дорослий підтвердив' : 'чекає підтвердження дорослого') : 'виконай у паперовому зошиті'}</small></span>${c.done ? '' : `<button type="button" class="btn" data-cdone="${i}">Готово</button>`}</li>`));
  return `<div class="order"><div class="oh"><small>Наказ штабу · ${fmtDate(a.d)}</small><em>${done}/${total}</em></div><b class="ot2">Обов’язкова місія</b><p>Спершу виконай ці завдання – тоді відкриються решта зошита, Тренувальна зала й Реванш. За кожне завдання з наказу – подвійні кредити.</p><span class="bar"><i style="width:${total ? done / total * 100 : 0}%"></i></span><ul class="olist">${li.join('')}</ul>${nx ? `<a class="btn big" href="#t-${nx.id}">Почати місію ▶</a>` : ''}</div>`;
}
function viewLocked() {
  const p = P(), nx = nextTask(p);
  app().innerHTML = `<a class="back" href="#home">← На головну</a><div class="lockv"><div class="hh-av">${avHTML(p.av, kitOf(p))}</div><small>Доступ закрито</small><h1>Спершу – наказ штабу</h1><p>Дорослий призначив обов’язкові завдання. Виконай їх – і решта зошита, Тренувальна зала й Реванш відкриються.</p>${nx ? `<a class="btn big" href="#t-${nx.id}">До наказу ▶</a>` : '<a class="btn big" href="#home">Переглянути наказ ▶</a>'}</div>`;

/* ===== арсенал: броня, спорядження, бази за кредити ===== */
function posterHTML(p, small, title, sub, link) {
  const pl = PLACES[p.place] || PLACES[0], k = kitOf(p);
  return `<div class="poster" style="--base:${pl.css}"><div class="pav">${avHTML(p.av, k)}</div><div class="pt"><small>${small} · ${pl.n}</small><h1>${title}</h1><p>${sub}</p><div class="row wrap"><span class="crd">⬡ <b>${p.cr}</b> кредитів</span>${link ? '<a class="btn" href="#arsenal">Арсенал ▶</a>' : ''}</div><p class="kitl">${HEROES[p.av] ? ARMOR[k.s || 0].n + (k.g ? ' · ' + GEAR[k.g].n : '') : 'Власний аватар – броня лише для героїв штабу'}</p></div></div>`;
}
let ARTAB = 'armor';
function viewArsenal() {
  const p = P(), hid = p.av, hero = !!HEROES[hid], k = kitOf(p), lvl = levelOf(p.xp), tab = ARTAB;
  const tabs = [['armor', 'Броня'], ['gear', 'Спорядження'], ['base', 'Бази']];
  app().innerHTML = `<a class="back" href="#garden">← До штабу</a>${posterHTML(p, 'Арсенал', esc(avName(hid) || p.name), 'Кредити – за правильні відповіді. Завдання з наказу дорослого дають удвічі більше. Звання й нових героїв купити не можна – лише заслужити.', false)}
  <div class="tabs">${tabs.map(([x, n]) => `<button class="opt sm ${tab === x ? 'on' : ''}" data-ar="${x}">${n}</button>`).join('')}</div><div class="shop"></div>`;
  $$('[data-ar]').forEach(b => b.onclick = () => { ARTAB = b.dataset.ar; viewArsenal(); });
  const shop = $('.shop'), cost = (c, can, label) => p.cr >= c ? `<button class="btn" ${can ? '' : 'disabled'} data-buy>${label || 'Купити'} · ⬡ ${c}</button>` : `<button class="btn" disabled>Бракує ⬡ ${c - p.cr}</button>`;
  const buy = (c, fn, msg) => { if (p.cr < c) return; p.cr -= c; fn(); save(CUR); header(); viewArsenal(); const pv = $('.poster'); if (pv) burst(pv); toast(msg); };
  if (tab !== 'base' && !hero) { shop.outerHTML = '<div class="card"><b>Броня й спорядження – лише для героїв штабу.</b><p class="note">Зараз у тебе власний аватар. Обери героя у штабі – і прокачуй його.</p><a class="btn" href="#garden">До штабу</a></div>'; return; }
  if (tab === 'armor') {
    const cur = k.s || 0;
    shop.innerHTML = ARMOR.slice(1).map((a, j) => { const i = j + 1, own = cur >= i, next = cur === i - 1;
      return `<div class="item ${own ? 'own' : next ? '' : 'lock'}" data-i="${i}"><div class="iv">${avHTML(hid, { s: i, g: k.g })}</div><b>${a.n}</b><small>${a.d}</small>${own ? '<button class="btn ghost" disabled>✓ Встановлено</button>' : next ? cost(a.c, true) : `<button class="btn ghost" disabled>Спершу ${ARMOR[i - 1].n.split(' ·')[0]}</button>`}</div>`; }).join('');
    $$('[data-buy]', shop).forEach(b => { const i = +b.closest('.item').dataset.i; b.onclick = () => buy(ARMOR[i].c, () => { p.kit[hid] = Object.assign({}, k, { s: i }); }, `Броню ${ARMOR[i].n.split(' ·')[0]} встановлено!`); });
  }
  if (tab === 'gear') {
    shop.innerHTML = Object.entries(GEAR).map(([g, x]) => { const own = p.own.g[g], on = k.g === g;
      return `<div class="item ${own ? 'own' : ''}" data-g="${g}"><div class="iv">${avHTML(hid, { s: k.s, g })}</div><b>${x.n}</b><small>${x.d}</small>${on ? '<button class="btn ghost" data-off>Зняти</button>' : own ? '<button class="btn" data-eq>Обладнати</button>' : cost(x.c, true)}</div>`; }).join('');
    $$('[data-buy]', shop).forEach(b => { const g = b.closest('.item').dataset.g; b.onclick = () => buy(GEAR[g].c, () => { p.own.g[g] = 1; p.kit[hid] = Object.assign({}, k, { g }); }, `${GEAR[g].n}: куплено й обладнано!`); });
    $$('[data-eq]', shop).forEach(b => b.onclick = () => { p.kit[hid] = Object.assign({}, k, { g: b.closest('.item').dataset.g }); save(CUR); header(); viewArsenal(); });
    $$('[data-off]', shop).forEach(b => b.onclick = () => { p.kit[hid] = Object.assign({}, k, { g: '' }); save(CUR); header(); viewArsenal(); });
  }
  if (tab === 'base') {
    shop.innerHTML = PLACES.map((x, i) => { const own = p.own.b[i], on = p.place === i, lockd = lvl < x.lvl;
      return `<div class="item ${own ? 'own' : lockd ? 'lock' : ''}" data-b="${i}"><div class="bsw" style="background:${x.css}"><i></i></div><b>${x.n}</b><small>${x.d}${lockd ? ` · відкривається з рівня ${x.lvl}` : ''}</small>${on ? '<button class="btn ghost" disabled>✓ Тут твій штаб</button>' : own ? '<button class="btn" data-sel>Перенести штаб</button>' : lockd ? `<button class="btn ghost" disabled>Рівень ${x.lvl}</button>` : cost(x.c, true)}</div>`; }).join('');
    $$('[data-buy]', shop).forEach(b => { const i = +b.closest('.item').dataset.b; b.onclick = () => buy(PLACES[i].c, () => { p.own.b[i] = 1; p.place = i; }, `Нова база: ${PLACES[i].n}!`); });
    $$('[data-sel]', shop).forEach(b => b.onclick = () => { p.place = +b.closest('.item').dataset.b; save(CUR); viewArsenal(); });
  }
}

/* ===== розвідувальне досьє: текст, у якому захована відповідь ===== */
const DOS_TEXT = {
  space: ['Космос: що треба знати агентові', 'Науку, яка вивчає зорі, планети й увесь космос, називають астрономією. Астрономи роздивляються далекі небесні тіла через телескоп – прилад, що наближає й збільшує те, що дуже далеко.\nЦентр нашої Сонячної системи – Сонце. Це зоря, і вона така величезна, що важить більше, ніж усі планети разом. Після Сонця й Місяця найяскравіше на нічному небі світить планета Венера: її видно навіть без телескопа ввечері або перед світанком. Червонуватий Марс давні римляни назвали на честь свого бога війни.\n12 квітня 1961 року Юрій Гагарін став першою людиною, яка полетіла в космос. Перший космонавт незалежної України – Леонід Каденюк: 1997 року він полетів на американському кораблі «Колумбія». А поверхнею Місяця колись їздили самохідні апарати-місяцеходи, якими керували із Землі.'],

  sand: ['Піщані горби', 'Вітер може переносити пісок і складати з нього цілі пагорби. Ті, що утворюються на берегах морів, океанів, великих озер і річок, називають дюнами. На дюнах часто ростуть трави й кущі, а іноді навіть сосни – вони скріплюють пісок корінням.\nБархани – піщані горби в пустелях. Вони мають форму півмісяця з «ріжками», спрямованими за вітром, і майже не вкриті рослинами. Під дією вітру бархани повільно мандрують пустелею.'],
  bodies: ['Небесні тіла', 'Зоря – це велетенська розпечена куля газу, яка сама випромінює світло й тепло. Найближча до нас зоря – Сонце.\nПланета сама не світиться: вона рухається по орбіті навколо зорі й світить відбитим від неї світлом. Земля – одна з планет, що обертаються навколо Сонця.\nСупутник обертається навколо планети. Супутник Землі – Місяць: він сірий, укритий кратерами й теж світить відбитим сонячним світлом. Комета – брила з льоду й пилу; коли вона підлітає до Сонця, у неї виростає довгий світлий хвіст.'],

  belts: ['Теплові пояси Землі', 'Сонце нагріває Землю неоднаково, тому на планеті виділяють теплові пояси. Жаркий пояс лежить обабіч екватора: тут Сонце піднімається високо над горизонтом, а його промені падають майже прямовисно, тобто мають найбільший кут падіння. Тому там спекотно цілий рік.\nПомірні пояси лежать між жарким і холодними: тут чітко змінюються чотири пори року. Холодні пояси розташовані навколо полюсів. Там узимку кілька місяців триває полярна ніч – сонце майже не з’являється на небі, а влітку настає полярний день, і сонце цілодобово не заходить за горизонт.'],
  rain: ['Найбагатший ліс планети', 'Найбільше видів рослин і тварин на Землі живе у вологих тропічних (екваторіальних) лісах. Там цілий рік тепло й часто йдуть дощі, тому дерева ростуть у кілька ярусів, а на невеликій ділянці лісу можуть рости сотні різних видів дерев. Тут мешкають мавпи, ягуари, яскраві папуги й тисячі видів комах.\nУ хвойному лісі – тайзі – видів значно менше, а в савані панують трави з поодинокими деревами.'],
  tundra: ['Тундра', 'Тундра лежить на крайній півночі, біля Північного Льодовитого океану. Лісу там немає: зима сувора, довга й холодна, а літо коротке й прохолодне. Земля під поверхнею не відтає навіть улітку – це вічна мерзлота.\nРостуть лише низенькі рослини: мохи, лишайники, карликові берези й верби. Живуть північні олені, песці, лемінги. Пустеля, навпаки, спекотна й суха, а серед льодовиків майже немає літа.'],
  zones: ['Від полюса до екватора', 'Уяви, що ти мандруєш від полюса до екватора. Спочатку довкола – льодовики й полярні пустелі, де майже нічого не росте. Трохи тепліше – і починається тундра з мохами та лишайниками. Далі виростає тайга – густі хвойні ліси. За нею – мішані ліси, де ялини ростуть поруч із дубами й березами.\nЩе ближче до екватора ліс рідшає, і відкриваються степи та лісостепи з травами. Далі стає спекотно й сухо – це напівпустелі й пустелі. Потім починаються савани: трави й поодинокі дерева. А біля самого екватора – вологі тропічні ліси, де тепло й дощі цілий рік.'],
  cont: ['Материки', 'Материк – величезна ділянка суходолу, оточена морями й океанами. На Землі шість материків. Найбільший – Євразія: на ньому розташовані і Європа, і Азія, а отже, й Україна. Спекотна Африка лежить по обидва боки від екватора.\nЗа Атлантичним океаном – дві Америки: Північна Америка й Південна Америка, з’єднані вузьким перешийком. Найменший материк – Австралія, а найхолодніший, укритий кригою, – Антарктида біля Південного полюса.'],
  parts: ['Частини світу', 'Частини світу – це не те саме, що материки. Материків шість, і частин світу теж шість, але поділено їх інакше. Материк Євразію ділять на дві частини світу – Європу й Азію; межу між ними часто проводять Уральськими горами.\nАфрика й Антарктида – водночас і материки, і частини світу. А дві Америки – Північну й Південну – разом вважають однією частиною світу: Америкою. Ще одна частина світу – Австралія з Океанією: так називають материк Австралію разом із тисячами островів Тихого океану.'],
  epi: ['Що таке епіграф', 'Епіграф – це короткий вислів, цитата або прислів’я, які автор ставить перед текстом, одразу після заголовка. Зазвичай епіграф пишуть праворуч, а під ним указують, хто це сказав.\nЕпіграф – не заголовок і не перше речення тексту: він стоїть окремо й підказує читачеві головну думку твору. Наприклад, перед казкою про лінивого ведмедика можна поставити прислів’я «Без труда нема плода».']
};
